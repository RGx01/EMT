version: 2
updates:
  # Python dependencies in requirements.txt.
  # Security fixes are raised immediately; routine version bumps weekly,
  # grouped into a single PR to keep the noise down.
  - package-ecosystem: "pip"
    directory: "/"
    # PRs go to dev, as every change does (docs/CONTRIBUTING.md); Dependabot reads the default
    # branch's copy of this file wherever it raises them.
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      python-deps:
        patterns:
          - "*"
        # pypdf comes on its own: a bump is merged only after the bill gate passes
        # (.build/pypdf_gate.py, docs/DEVELOPMENT.md "A pypdf bump").
        exclude-patterns:
          - "pypdf"

  # The workflows' actions, pinned to commit SHAs (a tag can be moved; a SHA cannot). Dependabot
  # keeps the pins current and raises a major version as its own PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
