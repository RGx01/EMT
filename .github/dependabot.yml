version: 2
updates:
  # Python dependencies in requirements.txt.
  # Security fixes are raised immediately; routine version bumps weekly,
  # grouped into a single PR to keep the noise down.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      python-deps:
        patterns:
          - "*"
        # pypdf comes on its own: a bump is merged only after the bill gate passes
        # (.build/pypdf_gate.py, docs/DEVELOPMENT.md "A pypdf bump").
        exclude-patterns:
          - "pypdf"
