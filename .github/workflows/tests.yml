name: Tests

# Runs the EMT unit-test suite the same way run_tests.sh runs it locally:
# file-isolated (each test module in its own process, because several install
# sys.modules stubs at import time). The suite includes
# tests/test_graphql_deprecation_check.py.
#
# Actions minutes: this repo is private, so every run is billed.
#  9 Oct 2026  A feature branch ran twice per PR (its push and the PR), two jobs each. Now a
#              branch is tested through its pull request alone, on 3.12, the Python the add-on
#              ships.
# 10 Oct 2026  The merge to dev re-tested what its PR had just passed, on two Pythons: about
#              7 of a PR's ~11 billed minutes. A push now runs only on main (both Pythons, so
#              3.13 is still met before a release). And a change that touches only docs runs
#              nothing, EXCEPT the two design docs whose figures the suite asserts
#              (tests/test_b_design_figures.py): editing those still runs the tests. There is
#              no required check to wait on (a private repo on the free plan has no branch
#              protection), so a skipped run blocks no merge.

on:
  push:
    branches: [main]
    paths:            # the same list as pull_request's: keep the two in step
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!LICENSE"
      - "!screenshots/**"
      - "docs/reference/architecture.md"
      - "docs/history/design/EMT-v5_B_coordinator_design.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!LICENSE"
      - "!screenshots/**"
      - "docs/reference/architecture.md"
      - "docs/history/design/EMT-v5_B_coordinator_design.md"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the add-on runs: build.yaml pins the HA base image to Alpine
        # 3.22, whose python3 is 3.12. 3.13 is the next one, so an Alpine bump is
        # not the first time the suite meets it. Nothing runs EMT below 3.12; the
        # 3.10 leg this replaces (4 Oct 2026) guarded a floor no install uses.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run test suite (file-isolated)
        env:
          PYTEST: "python -m pytest"
        run: bash run_tests.sh