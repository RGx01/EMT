name: Tests

# Runs the EMT unit-test suite on every push and pull request, the same way
# run_tests.sh runs it locally: file-isolated (each test module in its own
# process, because several install sys.modules stubs at import time). The suite
# includes tests/test_graphql_deprecation_check.py.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the add-on runs: build.yaml pins the HA base image to Alpine
        # 3.22, whose python3 is 3.12. 3.13 is the next one, so an Alpine bump is
        # not the first time the suite meets it. Nothing runs EMT below 3.12; the
        # 3.10 leg this replaces (4 Oct 2026) guarded a floor no install uses.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run test suite (file-isolated)
        env:
          PYTEST: "python -m pytest"
        run: bash run_tests.sh