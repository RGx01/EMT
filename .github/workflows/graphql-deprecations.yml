name: GraphQL deprecation check

# Introspects the live Kraken (Octopus) GraphQL schema and opens/updates
# `graphql-deprecation` issues for any field EMT selects that Octopus has marked
# deprecated (BL-16), AND watches for NEW/removed fields on the IOG reconstruction types
# (BL-28). The early-warning half of BL-16, mirroring BottlecapDave's
# checkGraphqlDeprecations. Introspection is unauthenticated, so no secret is
# needed; the job uses only the built-in GITHUB_TOKEN to manage issues.

on:
  schedule:
    - cron: "0 6 * * 1"      # weekly, Monday 06:00 UTC
  workflow_dispatch:          # allow manual runs

permissions:
  issues: write
  contents: read

concurrency:
  group: graphql-deprecations
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"

      - name: Introspect schema for deprecated fields EMT uses
        run: |
          python .build/check_graphql_deprecations.py \
            --source kraken_api_client.py \
            --out findings.json

      - name: Open or update deprecation issues
        # One issue per deprecated FIELD, listing every type it is on (8 types carry `provider`).
        # Until 2 Nov 2026 the open-issue list was read once before the loop, so findings sharing a
        # field each opened their own issue.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          count=$(jq 'length' findings.json)
          echo "Deprecations affecting EMT: $count"
          if [ "$count" -eq 0 ]; then
            echo "Nothing to do."
            exit 0
          fi

          # Ensure the label exists (no-op if it already does).
          gh label create graphql-deprecation \
            --color BFDADC \
            --description "A GraphQL field EMT uses has been deprecated upstream" \
            2>/dev/null || true

          # Open issues currently carrying the label (for de-dup).
          existing=$(gh issue list --label graphql-deprecation --state open \
            --limit 200 --json title --jq '.[].title')

          jq -c 'group_by(.field)[] | {field: .[0].field, types: [.[].type] | unique,
                   removal: ([.[].removal // "unknown"] | min), reason: .[0].reason}' findings.json |
          while read -r row; do
            field=$(echo "$row"   | jq -r '.field')
            types=$(echo "$row" | jq -r --arg f "$field" '.types | map("`" + . + "." + $f + "`") | join(", ")')
            removal=$(echo "$row" | jq -r '.removal')
            reason=$(echo "$row"  | jq -r '.reason')
            title="[GraphQL Deprecation] ${field} — ${removal}"

            # De-dup by field name so a shifted removal date doesn't double-post.
            if echo "$existing" | grep -qF -- "] ${field} —"; then
              echo "Issue already open for '${field}' — skipping."
              continue
            fi

            body=$(printf '%s\n\n**Where**: %s\n**Scheduled removal**: %s\n\n**Deprecation reason**\n```\n%s\n```\n\n_Auto-generated by `.build/check_graphql_deprecations.py` (weekly GraphQL deprecation check). EMT selects this field; migrate before the removal date._' \
              "A GraphQL field EMT uses is flagged deprecated on the live Kraken schema." \
              "$types" "$removal" "$reason")

            gh issue create --title "$title" --label graphql-deprecation --body "$body"
            echo "Opened: $title"
          done

      - name: Watch for new/changed fields on IOG reconstruction types
        # Opens (or comments on) one `graphql-schema-watch` issue when Octopus ADDS or removes a field
        # or enum value on the dispatch/measurement/intelligent/cap/band/rate-type surface EMT reads
        # (BL-28; #481's EV_BOOST arrived this way, before the bucket relabelling). Until 2 Nov 2026 this
        # step only reddened the run. A change already reported (the same diff) is not posted again.
        # Refresh the baseline once a change is understood: `python .build/check_graphql_field_watch.py
        # --update-baseline`, committed. Sees new schema SURFACE only, never a field starting to be
        # populated (that needs an authenticated query).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python .build/check_graphql_field_watch.py --out watch.json > /dev/null
          [ -s watch.json ] || { echo "Baseline unseeded — nothing to compare."; exit 0; }
          if [ "$(jq 'length' watch.json)" -eq 0 ]; then
            echo "No change on the watched types."
            exit 0
          fi
          digest=$(sha256sum watch.json | cut -c1-12)
          body=$(printf 'The Kraken schema changed on the types EMT watches. Review whether it changes how EMT reads dispatches, measurements or bands, then refresh the baseline.\n\n`diff %s`\n\n```json\n%s\n```\n\n_Auto-generated by `.build/check_graphql_field_watch.py` (weekly)._' \
            "$digest" "$(cat watch.json)")
          gh label create graphql-schema-watch --color C5DEF5 \
            --description "The Kraken schema changed on a type EMT watches" 2>/dev/null || true
          num=$(gh issue list --label graphql-schema-watch --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            gh issue create --title "[GraphQL schema] watched types changed" --label graphql-schema-watch --body "$body"
          elif gh issue view "$num" --json body,comments --jq '[.body] + [.comments[].body] | join("\n")' | grep -qF -- "diff ${digest}"; then
            echo "This change is already on #${num}."
          else
            gh issue comment "$num" --body "$body"
          fi
