<!--
  The Billing tab, drawn in the browser — C, 30 Sep 2026. Replaces the iframe of the
  pre-rendered daily_usage.html (energy_charts.generate_daily_import_export_charts,
  36 MB and ~9,700 inline scripts for three years of history).

  DATA: /api/periods?kind=…&include=net_cost for the picker (every period and its
  total), /api/energy?resolution=period&include=billing for a bill (the summary the
  card is formatted from), /api/energy?resolution=day&kind=month&include=billing for
  day charts, a calendar month at a time as they scroll into view. The server computes
  every figure with the functions the pre-render used (billing_view.py); this file
  only formats and draws.

  THE BILL CARD is energy_charts.render_billing_summary ported line for line, down to
  Python's number formatting (pyFixed: round-half-even on the exact binary value, and
  "-0.00"), so a card can be compared string-for-string with the pre-rendered page's.
  The side panel is build_day_chart_html's markup half, the data table the page's own
  _buildTableContent, unchanged.

  DAY CHARTS: Chart.js on a LINEAR x axis (bars at slot i, width 0.7) so the charged-
  rate lines keep Plotly's `shape: 'hv'` exactly — each rate point sits at i − 0.5 and
  `stepped: 'before'` draws horizontal-then-vertical, covering its slot. The rate axis
  shares the energy axis's zero (the page's _alignY2). Charts are built as they near
  the viewport and destroyed when far from it: a year is 365 canvases.

  STRUCTURE keeps the page's class names (.period-section, .bill-toggle, .bill-view,
  .day-chart-wrap, .chart-summary, .day-data-tables) so charts.html's PDF export reads
  it as it read the iframe.
-->
<script>
window.EMTBilling = (function () {
  var CHARTJS = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js';
  var MODES = {                       // the page's mode names → /api kinds
    month:    {kind: 'billing', label: 'Bill'},
    calmonth: {kind: 'month',   label: 'Month'},
    quarter:  {kind: 'quarter', label: 'Quarter'},
    year:     {kind: 'year',    label: 'Year'}
  };
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MAX_RATE_ROWS = 5, SPLIT_BAND_EPS = 0.0015;

  var state = {root: null, inited: false, mode: 'month', view: 'vanilla', censor: false,
               asc: false, showData: false, lists: {}, sel: {}, bills: {}, months: {},
               monthLoading: {}, charts: {}, forceLight: false, section: null, cur: null};

  // ── storage (per-viewer conveniences; never required) ─────────────────────
  function sget(k, d) { try { var v = sessionStorage.getItem('emtBill.' + k); return v === null ? d : v; } catch (e) { return d; } }
  function sset(k, v) { try { sessionStorage.setItem('emtBill.' + k, v); } catch (e) {} }
  function lget(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function lset(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var fetchJSON = function (url) {
    return fetch(apiUrl(url)).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; });
    });
  };
  function loadScript(src) {
    return new Promise(function (ok, bad) {
      if (window.Chart) { ok(); return; }
      var ex = document.querySelector('script[src="' + src + '"]');
      if (ex) { ex.addEventListener('load', ok); ex.addEventListener('error', bad); if (window.Chart) ok(); return; }
      var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad;
      document.head.appendChild(s);
    });
  }
  function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // ── Python's number formatting ────────────────────────────────────────────
  // f"{x:.nf}": the exact binary value, rounded half-to-even, sign kept on a
  // negative that rounds to zero ("-0.00"). toFixed rounds a tie AWAY from zero
  // (0.125 → "0.13" where Python gives "0.12"), so the digits are taken from a
  // long expansion — exact for a double at these magnitudes — and rounded here.
  function pyFixed(x, n) {
    if (x === null || x === undefined || isNaN(x)) return 'nan';
    var neg = x < 0 || (x === 0 && 1 / x < 0);
    var s = Math.abs(x).toFixed(Math.min(100, n + 25));
    var dot = s.indexOf('.');
    var ip = s.slice(0, dot), fr = s.slice(dot + 1);
    var keep = fr.slice(0, n), rest = fr.slice(n);
    var digits = ip + keep, up;
    if (rest.charAt(0) > '5') up = true;
    else if (rest.charAt(0) < '5') up = false;
    else up = /[1-9]/.test(rest.slice(1)) || /[13579]$/.test(digits);
    if (up) {
      var a = digits.split(''), i = a.length - 1;
      while (i >= 0) { if (a[i] === '9') { a[i] = '0'; i--; } else { a[i] = String(+a[i] + 1); break; } }
      if (i < 0) a.unshift('1');
      digits = a.join('');
    }
    var intLen = digits.length - n;
    var out = digits.slice(0, intLen) + (n ? '.' + digits.slice(intLen) : '');
    return (neg ? '-' : '') + out;
  }
  function pyRound(x, n) { return parseFloat(pyFixed(x, n)); }
  function paren(v, n) { return v < 0 ? '(' + pyFixed(-v, n) + ')' : pyFixed(v, n); }

  // ── the bill card: energy_charts.render_billing_summary ───────────────────
  function rateRows(channels) {                        // _bill_rate_rows
    var tk = 0.0, tc = 0.0, rows = '';
    if (channels.length > MAX_RATE_ROWS) {
      channels.forEach(function (c) { tk += pyRound(c.kwh, 3); tc += pyRound(c.cost, 2); });
      var avg = tk ? tc / tk : 0.0;
      rows = '\n            <tr>\n              <td></td><td>' + pyFixed(avg, 4) +
             ' <span style="opacity:0.6;">(avg of ' + channels.length + ' rates)</span></td>\n              <td>' +
             pyFixed(tk, 3) + '</td><td>' + paren(tc, 2) + '</td>\n            </tr>';
      return [rows, pyRound(tk, 3), pyRound(tc, 2)];
    }
    channels.forEach(function (c) {
      var k = pyRound(c.kwh, 3), cv = pyRound(c.cost, 2);
      tk += k; tc += cv;
      rows += '\n            <tr>\n              <td></td><td>' + pyFixed(c.rate, 4) + '</td>\n              <td>' +
              pyFixed(k, 3) + '</td><td>' + paren(cv, 2) + '</td>\n            </tr>';
    });
    return [rows, pyRound(tk, 3), pyRound(tc, 2)];
  }
  function totalRow(kwh, cost) {                       // _bill_total_row
    return '\n        <tr class="channel-total">\n          <td>Total</td><td></td><td>' + pyFixed(kwh, 3) +
           '</td><td>' + paren(cost, 2) + '</td>\n        </tr>';
  }
  function g(o, k, d) { return (o && Object.prototype.hasOwnProperty.call(o, k)) ? o[k] : d; }
  function splitRows(sm, exc) {                        // _bill_split_rows
    var ev = {}, home = {};
    (sm.ev_by_rate || []).forEach(function (r) { ev[r.rate] = r; });
    (sm.home_by_rate || []).forEach(function (r) { home[r.rate] = r; });
    var evTr = sm.ev_transition || {}, hoTr = sm.home_transition || {};
    var ck = exc ? 'cost_exc' : 'cost', ckr = ck + '_raw';
    var evk = 0; (sm.ev_by_rate || []).forEach(function (r) { evk += r.kwh; });
    if (evk + (evTr.kwh || 0.0) <= 1e-9) return null;
    function row(label, kwh, cost, note, rate) {
      if (rate === null || rate === undefined) rate = kwh ? cost / kwh : 0.0;
      return '\n        <tr><td>' + label + '</td><td>' + pyFixed(rate, 4) + (note || '') + '</td><td>' +
             pyFixed(kwh, 3) + '</td><td>' + paren(cost, 3) + '</td></tr>';
    }
    var rates = Object.keys(ev).concat(Object.keys(home)).map(Number)
      .filter(function (r, i, a) { return a.indexOf(r) === i; }).sort(function (a, b) { return a - b; });
    var bands = [];
    rates.forEach(function (r) {
      var last = bands.length ? bands[bands.length - 1] : null;
      if (last && (r - last[last.length - 1]) <= SPLIT_BAND_EPS) last.push(r); else bands.push([r]);
    });
    var html = '';
    bands.forEach(function (band) {
      var ek = 0, ec = 0, hk = 0, hc = 0, ecr = 0, hcr = 0;
      band.forEach(function (r) {
        var e = ev[r];
        if (e) { ek += e.kwh; ec += g(e, ck, 0.0); ecr += g(e, ckr, g(e, ck, 0.0)); }
        var h = home[r];
        if (h) { hk += h.kwh; hc += g(h, ck, 0.0); hcr += g(h, ckr, g(h, ck, 0.0)); }
      });
      var br = (ek + hk) > 1e-9 ? (ecr + hcr) / (ek + hk) : 0.0;
      if (ek > 1e-9) html += row('EV', ek, ec, '', br);
      if (hk > 1e-9) html += row('Home', hk, hc, '', br);
    });
    var note = ' <span style="opacity:0.6;">(transition)</span>';
    if ((evTr.kwh || 0.0) > 1e-9) {
      var r1 = evTr.kwh > 1e-9 ? g(evTr, ckr, g(evTr, ck, 0.0)) / evTr.kwh : null;
      html += row('EV', evTr.kwh, g(evTr, ck, 0.0), note, r1);
    }
    if ((hoTr.kwh || 0.0) > 1e-9) {
      var r2 = hoTr.kwh > 1e-9 ? g(hoTr, ckr, g(hoTr, ck, 0.0)) / hoTr.kwh : null;
      html += row('Home', hoTr.kwh, g(hoTr, ck, 0.0), note, r2);
    }
    return html;
  }
  function readsHtml(rs, re) {
    if (rs === null || rs === undefined) return '';
    var total = (re || 0.0) - (rs || 0.0);
    return '<br><span class="reads">Start: <span class="censored">' + pyFixed(rs, 3) + '</span>&nbsp;&nbsp;End: ' +
           '<span class="censored">' + pyFixed(re, 3) + '</span>&nbsp;&nbsp;Total: ' + pyFixed(total, 3) + ' kWh</span>';
  }
  function mpanHtml(meta) {
    return (meta && meta.mpan) ? '&nbsp;&nbsp;|&nbsp;&nbsp;MPAN: <span class="censored">' + esc(meta.mpan) + '</span>' : '';
  }
  function standingGroups(standing) {                  // {round(amount,4): days}, ascending
    var groups = {};
    standing.forEach(function (s) { var r = pyRound(s.amount, 4); groups[r] = (groups[r] || 0) + 1; });
    return Object.keys(groups).map(Number).sort(function (a, b) { return a - b; })
      .map(function (r) { return [r, groups[r]]; });
  }
  function renderCard(sm, cur, site) {
    if (!sm) return '';
    var meta = sm.meter_meta || {}, raw = sm.main_import_raw || [], reads = sm.main_import_reads || {};
    var meters = sm.meters || {}, totals = sm.totals || {};
    if (!site) {
      site = null;
      Object.keys(meta).some(function (k) { var m = meta[k]; if (m.site && !m.is_submeter) { site = m.site; return true; } return false; });
    }
    var html = '\n    <div class="billing-summary">\n      <table class="billing-table">\n        ' +
      (site ? '\n        <tr class="bill-site-header">\n          <td colspan="4"><span class="censored">' + esc(site) +
              '</span></td>\n        </tr>' : '') + '\n    ';
    var keys = Object.keys(meters).sort();
    var exportKeys = keys.filter(function (k) { return /\/ Export$/.test(k); });
    var remKeys = keys.filter(function (k) { return /\/ Import$/.test(k) && !((totals[k] || {}).is_submeter); });
    var subKeys = keys.filter(function (k) { return /\/ Import$/.test(k) && ((totals[k] || {}).is_submeter); });
    exportKeys.forEach(function (k) {
      var t = totals[k] || {};
      html += '\n        <tr class="channel-title">\n          <td colspan="4">Export' + mpanHtml(meta[k]) +
              readsHtml(t.read_start, t.read_end) + '</td>\n        </tr>\n        <tr class="channel-header">\n' +
              '          <td></td><td>Rate (' + cur + '/kWh)</td><td>kWh</td><td>Cost (' + cur + ')</td>\n        </tr>';
      html += rateRows(meters[k])[0];
      html += totalRow(t.kwh, t.cost);
    });
    var bm = sm.bill_method, excLbl = bm ? ', exc' : '';
    var standing = sm.standing || [];
    if (remKeys.length || subKeys.length) {
      html += '\n        <tr class="channel-title">\n          <td colspan="4">Import — total grid' +
              (remKeys.length ? mpanHtml(meta[remKeys[0]]) : '') + readsHtml(reads.read_start, reads.read_end) +
              '</td>\n        </tr>\n        <tr class="channel-header">\n          <td></td><td>Rate (' + cur + '/kWh' +
              excLbl + ')</td><td>kWh</td><td>Cost (' + cur + excLbl + ')</td>\n        </tr>';
      if (bm) {
        var sp = splitRows(sm, true);
        if (sp !== null) html += sp;
        else bm.rows.forEach(function (r) {
          var cell = r.collapsed ? pyFixed(r.rate_exc, 4) + ' <span style="opacity:0.6;">(avg of ' + r.n_rates + ' rates)</span>'
                                 : pyFixed(r.rate_exc, 4);
          html += '\n        <tr><td></td><td>' + cell + '</td><td>' + pyFixed(r.kwh, 3) + '</td><td>' + pyFixed(r.cost_exc, 3) + '</td></tr>';
        });
        html += '\n        <tr class="channel-total"><td>Total (exc)</td><td></td><td></td><td>' + pyFixed(bm.energy_exc, 2) + '</td></tr>';
        if (bm.standing_days) {
          var srows = bm.standing_rows || [];
          if (srows.length > 1) srows.forEach(function (s) {
            html += '\n        <tr class="standing"><td colspan="3">Standing charge (exc): ' + s.days + ' days @ ' + cur +
                    pyFixed(s.rate_exc, 4) + '/day</td><td>' + pyFixed(s.cost_exc, 2) + '</td></tr>';
          });
          else html += '\n        <tr class="standing"><td colspan="3">Standing charge (exc): ' + bm.standing_days + ' days @ ' + cur +
                       pyFixed(bm.standing_rate_exc, 4) + '/day</td><td>' + pyFixed(bm.standing_exc, 2) + '</td></tr>';
        }
        html += '\n        <tr class="bill-method"><td colspan="3">VAT @ ' + pyFixed(bm.vat_rate * 100, 0) + '%</td><td>' + cur +
                pyFixed(bm.vat_amount, 2) + '</td></tr>\n        <tr class="channel-total"><td colspan="3">Total incl. VAT</td><td>' +
                cur + pyFixed(bm.inc_total, 2) + '</td></tr>';
      } else {
        var rr = rateRows(raw), sp2 = splitRows(sm, false);
        html += sp2 !== null ? sp2 : rr[0];
        html += totalRow(rr[1], rr[2]);
        if (standing.length) {
          standingGroups(standing).forEach(function (gr) {
            html += '\n        <tr class="standing">\n          <td colspan="3">Standing charge: ' + gr[1] + ' days @ ' + cur +
                    pyFixed(gr[0], 4) + '/day</td>\n          <td>' + pyFixed(gr[0] * gr[1], 2) + '</td>\n        </tr>';
          });
          var ssum = 0.0; standing.forEach(function (s) { ssum += s.amount; });
          var incl = rr[2] + pyRound(ssum, 2);
          html += '\n        <tr class="channel-total">\n          <td colspan="3">Total incl. standing charge</td><td>' +
                  paren(incl, 2) + '</td>\n        </tr>';
        }
      }
      html += '\n        <tr class="submeter-breakdown-header">\n          <td colspan="4">Breakdown by meter</td>\n        </tr>';
      function block(title, k) {
        var r = rateRows(meters[k]);
        return '\n        <tr class="channel-title submeter-indent">\n          <td colspan="4">' + title + '</td>\n        </tr>\n' +
               '        <tr class="channel-header submeter-indent">\n          <td></td><td>Rate (' + cur + '/kWh)</td><td>kWh</td><td>Cost (' +
               cur + ')</td>\n        </tr>' + r[0] + totalRow(r[1], r[2]);
      }
      remKeys.forEach(function (k) { html += block('Direct import', k); });
      subKeys.forEach(function (k) {
        var m = meta[k] || {};
        var label = m.device || k.split(' / ')[0].replace('(Sub-meter)', '').replace('(sub-meter)', '').trim();
        html += block(esc(label), k);
      });
    }
    if (standing.length && !(remKeys.length || subKeys.length)) {
      standingGroups(standing).forEach(function (gr) {
        html += '\n        <tr class="standing">\n          <td colspan="3">Standing Charge: ' + gr[1] + ' days @ ' + cur +
                pyFixed(gr[0], 4) + '/day</td>\n          <td>' + pyFixed(gr[0] * gr[1], 2) + '</td>\n        </tr>';
      });
    }
    html += '\n        <tr class="grand-total">\n          <td colspan="3">Total Bill</td>\n          <td>' + cur +
            pyFixed(sm.total_cost, 2) + '</td>\n        </tr>';
    return html + '\n      </table>\n    </div>';
  }

  // ── the day side panel: build_day_chart_html's markup half ────────────────
  function cs(text, color, size, bold) {
    return '<span style="color:' + color + ';font-size:' + (size || '0.9em') + ';line-height:1.6;white-space:nowrap;' +
           (bold ? 'font-weight:600;' : '') + '">' + text + '</span>';
  }
  function panelRates(rates, color, cur) {
    return rates.map(function (r) {
      return cs(pyFixed(r[0], 3) + ' kWh @ ' + cur + pyFixed(r[1], 4) + (r[2] ? ' (avg of ' + r[2] + ')' : ''), color, '0.8em');
    }).join('');
  }
  function renderPanel(day, p, cur) {
    var t = '';
    if (p.total_import > 0) {
      t += cs('Total import: ' + pyFixed(p.total_import, 3) + ' kWh', p.main_color);
      t += cs('Import cost: ' + cur + pyFixed(p.import_cost, 2), p.main_color);
      if (p.import_cost_exc !== null && p.import_cost_exc !== undefined)
        t += cs('Import cost (exc VAT): ' + cur + pyFixed(p.import_cost_exc, 2), p.main_color);
    }
    if (p.export_kwh > 0) {
      t += cs('Total export: ' + pyFixed(p.export_kwh, 3) + ' kWh', p.export_color);
      t += cs('Export credit: ' + cur + pyFixed(p.export_cost, 2), p.export_color);
      t += panelRates(p.export_rates, p.export_color, cur);
    }
    var cols = p.breakdown.map(function (r) {
      return '<div class="scol">' + cs('↳ ' + esc(r.label), r.color, '1em', true) + cs(pyFixed(r.kwh, 3) + ' kWh', r.color, '1em') +
             cs(cur + pyFixed(r.cost, 2), r.color, '1em') + panelRates(r.rates, r.rate_color, cur) + '</div>';
    });
    return '<div class="chart-summary"><div class="day-label">' + day + '</div><div class="stotals">' + t + '</div>' +
           (cols.length ? '<div class="sdivider"></div><div class="scols">' + cols.join('') + '</div>' : '') + '</div>';
  }

  // ── the day data table: the page's _buildTableContent, unchanged ──────────
  function buildTable(wrap, d) {
    var cur = d.currency || '\xa3';
    var exportKey = 'electricity_main_export', directKey = 'electricity_main';
    var deviceKeys = Object.keys(d.meters).filter(function (k) { return k !== exportKey && k !== directKey; }).sort();
    var orderedKeys = [exportKey, directKey].concat(deviceKeys).filter(function (k) { return d.meters[k]; });
    var colNames = ['Total Import'].concat(orderedKeys.map(function (k) { return d.meters[k].nice_name; }));
    var numMeters = colNames.length;
    var br = !!d.bill_rounding, ratio = d.exc_ratio || [], approx = d.exc_approx || [];
    var invat = d.fallback_invat || (1.0 / 1.05);
    function isImp(idx) { return idx === 0 ? true : !d.meters[orderedKeys[idx - 1]].is_export; }
    function money(v) { return (Math.abs(v) >= 0.000005) ? (cur + v.toFixed(5)) : '—'; }
    var html = '<div class="day-meter-table"><table><thead><tr><th rowspan="2">Period</th>';
    colNames.forEach(function (n, idx) { html += '<th colspan="' + ((br && isImp(idx)) ? 4 : 3) + '">' + esc(n) + '</th>'; });
    html += '</tr><tr>';
    for (var c = 0; c < numMeters; c++) {
      html += (br && isImp(c)) ? '<th>Rate (exc)</th><th>kWh</th><th>' + cur + ' exc</th><th>' + cur + ' inc</th>'
                               : '<th>Rate</th><th>kWh</th><th>' + cur + '</th>';
    }
    html += '</tr></thead><tbody>';
    var excTot = []; for (var e = 0; e < numMeters; e++) excTot[e] = 0;
    for (var i = 0; i < d.slots; i++) {
      var rt = (ratio[i] == null) ? invat : ratio[i], ap = !!approx[i];
      html += '<tr><td>' + d.x_ranges[i].split(' - ')[0] + '</td>';
      var ti_kwh = parseFloat(Math.abs(d.ti_kwh ? (d.ti_kwh[i] || 0) : 0).toFixed(3));
      var ti_cost = parseFloat(Math.abs(d.ti_cost ? (d.ti_cost[i] || 0) : 0).toFixed(5));
      var ti_rate = d.ti_rate ? (d.ti_rate[i] || 0) : 0;
      if (br) {
        var tiExc = ti_cost * rt; excTot[0] += tiExc;
        html += '<td>' + (ti_rate ? (cur + (ti_rate * rt).toFixed(4)) : '—') + '</td><td>' + ti_kwh.toFixed(3) + '</td>' +
                '<td>' + (ti_cost >= 0.000005 ? ((ap ? '≈' : '') + money(tiExc)) : '—') + '</td>' +
                '<td>' + (ti_cost >= 0.000005 ? (cur + ti_cost.toFixed(5)) : '—') + '</td>';
      } else {
        html += '<td>' + (ti_rate ? (cur + ti_rate.toFixed(4)) : '—') + '</td><td>' + ti_kwh.toFixed(3) + '</td>' +
                '<td>' + (ti_cost >= 0.000005 ? (cur + ti_cost.toFixed(5)) : '—') + '</td>';
      }
      orderedKeys.forEach(function (k, ki) {
        var m = d.meters[k], imp = !m.is_export;
        var kwh = parseFloat(Math.abs(m.y[i] || 0).toFixed(3));
        var cost = parseFloat(Math.abs((m.cost && m.cost[i]) || 0).toFixed(5));
        var rr = m.rate, rate = rr[i] !== undefined ? rr[i] : (rr[rr.length - 1] || 0);
        if (br && imp) {
          var ex = cost * rt; excTot[ki + 1] += ex;
          html += '<td>' + (rate ? (cur + (rate * rt).toFixed(4)) : '—') + '</td><td>' + kwh.toFixed(3) + '</td>' +
                  '<td>' + (cost >= 0.000005 ? ((ap ? '≈' : '') + money(ex)) : '—') + '</td>' +
                  '<td>' + (cost >= 0.000005 ? (cur + cost.toFixed(5)) : '—') + '</td>';
        } else {
          html += '<td>' + (rate ? (cur + rate.toFixed(4)) : '—') + '</td><td>' + kwh.toFixed(3) + '</td>' +
                  '<td>' + (cost >= 0.000005 ? (cur + cost.toFixed(5)) : '—') + '</td>';
        }
      });
      html += '</tr>';
    }
    html += '</tbody><tfoot><tr><td>Total</td>';
    var ttk = 0, ttc = 0;
    orderedKeys.forEach(function (k) {
      var t = (d.meter_totals && d.meter_totals[k]) || {kwh: 0, cost: 0};
      if (!d.meters[k].is_export) { ttk += t.kwh; ttc += t.cost; }
    });

  // ── day charts ────────────────────────────────────────────────────────────

  // the rate axis's zero is then aligned with it — the page's _alignY2, unchanged.

  // ── the nav bar ───────────────────────────────────────────────────────────

  function col(heading, html, compare) {

  }
  function mount(sec, html) {

  // ── public ────────────────────────────────────────────────────────────────
  function init(root) {

    root.classList.add('emt-bill');

    var lbl = root.querySelector('#period-rolodex-label');

    // Theme: the charts' colours are baked into their canvases — watch the attribute.
    new MutationObserver(function () { rerender(); })
      .observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
    return loadScript(CHARTJS).then(show);
  }
  function rerender() {                                  // new theme or size: redraw what is drawn
    var days = Object.keys(state.charts);

    days.forEach(buildChart);
  }
  function refresh() {                                   // periodic: totals, the bill, and today's month
