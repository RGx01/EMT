<!--
  The Billing tab, drawn in the browser — C, 30 Sep 2026. Replaces the iframe of the
  pre-rendered daily_usage.html (energy_charts.generate_daily_import_export_charts,
  36 MB and ~9,700 inline scripts for three years of history).

  DATA: /api/periods?kind=…&include=net_cost for the picker (every period and its
  total), /api/energy?resolution=period&include=billing for a bill (the summary the
  card is formatted from), /api/energy?resolution=day&kind=month&include=billing for
  day charts, a calendar month at a time as they scroll into view. The server computes
  every figure with the functions the pre-render used (billing_view.py); this file
  only formats and draws.

  THE BILL CARD AND SIDE PANEL arrive as rows (bill_card.py): which rows, every figure
  rounded, banded, collapsed and formatted. This file prints them and decides nothing —
  so the arithmetic stays where the suite can test it. (For a day, #21 carried a JS
  port of render_billing_summary, arithmetic and Python's number formatting included.)
  The data table is the page's own _buildTableContent, unchanged.

  DAY CHARTS: Chart.js on a LINEAR x axis (bars at slot i, width 0.7) so the charged-
  rate lines keep Plotly's `shape: 'hv'` exactly — each rate point sits at i − 0.5 and
  `stepped: 'before'` draws horizontal-then-vertical, covering its slot. The rate axis
  shares the energy axis's zero (the page's _alignY2). Charts are built as they near
  the viewport and destroyed when far from it: a year is 365 canvases.

  STRUCTURE keeps the page's class names (.period-section, .bill-toggle, .bill-view,
  .day-chart-wrap, .chart-summary, .day-data-tables) so charts.html's PDF export reads
  it as it read the iframe.
-->
<script>
window.EMTBilling = (function () {
  var CHARTJS = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js';
  var MODES = {                       // the page's mode names → /api kinds
    month:    {kind: 'billing', label: 'Bill'},
    calmonth: {kind: 'month',   label: 'Month'},
    quarter:  {kind: 'quarter', label: 'Quarter'},
    year:     {kind: 'year',    label: 'Year'}
  };
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  var state = {root: null, inited: false, mode: 'month', view: 'vanilla', censor: false,
               asc: false, showData: false, lists: {}, sel: {}, bills: {}, months: {},
               monthLoading: {}, charts: {}, forceLight: false, section: null, cur: null, corr: false};

  // ── storage (per-viewer conveniences; never required) ─────────────────────
  function sget(k, d) { try { var v = sessionStorage.getItem('emtBill.' + k); return v === null ? d : v; } catch (e) { return d; } }
  function sset(k, v) { try { sessionStorage.setItem('emtBill.' + k, v); } catch (e) {} }
  function lget(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function lset(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var fetchJSON = function (url) {
    return fetch(apiUrl(url)).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; });
    });
  };
  function loadScript(src) {
    return new Promise(function (ok, bad) {
      if (window.Chart) { ok(); return; }
      var ex = document.querySelector('script[src="' + src + '"]');
      if (ex) { ex.addEventListener('load', ok); ex.addEventListener('error', bad); if (window.Chart) ok(); return; }
      var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad;
      document.head.appendChild(s);
    });
  }
  function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // ── the bill card: bill_card.card's rows, printed ─────────────────────────
  // Every figure arrives formatted; which rows appear, their rounding, the EV/Home
  // bands and the Agile collapse are bill_card.py's, tested in the suite. This only
  // turns a row into its table row.
  function noteHtml(n) {
    if (!n) return '';
    return ' <span style="opacity:0.6;">' + (n === 'transition' ? '(transition)' : '(avg of ' + n.avg + ' rates)') + '</span>';
  }
  function td(x, span) { return '<td' + (span ? ' colspan="' + span + '"' : '') + '>' + x + '</td>'; }
  function rowHtml(r) {
    var ind = r.indent ? ' submeter-indent' : '';
    switch (r.type) {
      case 'rate':  return '<tr>' + td('') + td(r.rate + noteHtml(r.note)) + td(r.kwh) + td(r.cost) + '</tr>';
      case 'split': return '<tr>' + td(esc(r.label)) + td(r.rate + noteHtml(r.note)) + td(r.kwh) + td(r.cost) + '</tr>';
      case 'total': return '<tr class="channel-total">' + td('Total') + td('') + td(r.kwh) + td(r.cost) + '</tr>';
      case 'total_exc': return '<tr class="channel-total">' + td('Total (exc)') + td('') + td('') + td(r.value) + '</tr>';
      case 'line': case 'line_block': case 'line_inline':
        return '<tr class="' + r.cls + '">' + td(esc(r.text), 3) + td(r.value) + '</tr>';
      case 'breakdown': return '<tr class="submeter-breakdown-header">' + td('Breakdown by meter', 4) + '</tr>';
      case 'title':
        var mpan = r.mpan ? '&nbsp;&nbsp;|&nbsp;&nbsp;MPAN: <span class="censored">' + esc(r.mpan) + '</span>' : '';
        var rd = r.reads ? '<br><span class="reads">Start: <span class="censored">' + r.reads.start + '</span>&nbsp;&nbsp;End: ' +
          '<span class="censored">' + r.reads.end + '</span>&nbsp;&nbsp;Total: ' + r.reads.total + ' kWh</span>' : '';
        return '<tr class="channel-title' + ind + '">' + td(esc(r.text) + mpan + rd, 4) + '</tr>';
      case 'header': return '<tr class="channel-header' + ind + '">' + td('') + td(esc(r.rate)) + td('kWh') + td(esc(r.cost)) + '</tr>';
    }
    return '';
  }
  // `site`: omitted → the card's own; null → none (the parity check, which compares
  // with a page that read its site from elsewhere).
  function renderCard(card, site) {
    if (!card) return '';
    if (site === undefined) site = card.site;
    return '<div class="billing-summary"><table class="billing-table">' +
      (site ? '<tr class="bill-site-header">' + td('<span class="censored">' + esc(site) + '</span>', 4) + '</tr>' : '') +
      card.rows.map(rowHtml).join('') + '</table></div>';
  }

  // ── the day side panel: bill_card.panel_lines, printed ────────────────────
  function spans(lines) {
    return lines.map(function (x) {
      return '<span style="color:' + x.color + ';font-size:' + x.size + ';line-height:1.3;white-space:nowrap;' +
             (x.bold ? 'font-weight:600;' : '') + '">' + esc(x.text) + '</span>';
    }).join('');
  }
  function renderPanel(day, lines) {
    var cols = lines.cols.map(function (c) { return '<div class="scol">' + spans(c) + '</div>'; });
    return '<div class="chart-summary"><div class="day-label">' + day + '</div><div class="stotals">' + spans(lines.totals) + '</div>' +
           (cols.length ? '<div class="sdivider"></div><div class="scols">' + cols.join('') + '</div>' : '') + '</div>';
  }

  // ── the day data table: the page's _buildTableContent, unchanged ──────────
  function buildTable(wrap, d) {
    var cur = d.currency || '\xa3';
    var exportKey = 'electricity_main_export', directKey = 'electricity_main';
    var deviceKeys = Object.keys(d.meters).filter(function (k) { return k !== exportKey && k !== directKey; }).sort();
    var orderedKeys = [exportKey, directKey].concat(deviceKeys).filter(function (k) { return d.meters[k]; });
    var colNames = ['Total Import'].concat(orderedKeys.map(function (k) { return d.meters[k].nice_name; }));
    var numMeters = colNames.length;
    var br = !!d.bill_rounding, ratio = d.exc_ratio || [], approx = d.exc_approx || [];
    var invat = d.fallback_invat || (1.0 / 1.05);
    function isImp(idx) { return idx === 0 ? true : !d.meters[orderedKeys[idx - 1]].is_export; }
    function money(v) { return (Math.abs(v) >= 0.000005) ? (cur + v.toFixed(5)) : '—'; }
    var html = '<div class="day-meter-table"><table><thead><tr><th rowspan="2">Period</th>';
    colNames.forEach(function (n, idx) { html += '<th colspan="' + ((br && isImp(idx)) ? 4 : 3) + '">' + esc(n) + '</th>'; });
    html += '</tr><tr>';
    for (var c = 0; c < numMeters; c++) {
      html += (br && isImp(c)) ? '<th>Rate (exc)</th><th>kWh</th><th>' + cur + ' exc</th><th>' + cur + ' inc</th>'
                               : '<th>Rate</th><th>kWh</th><th>' + cur + '</th>';
    }
    html += '</tr></thead><tbody>';
    var excTot = []; for (var e = 0; e < numMeters; e++) excTot[e] = 0;
    for (var i = 0; i < d.slots; i++) {
      var rt = (ratio[i] == null) ? invat : ratio[i], ap = !!approx[i];
      html += '<tr><td>' + d.x_ranges[i].split(' - ')[0] + '</td>';
      var ti_kwh = parseFloat(Math.abs(d.ti_kwh ? (d.ti_kwh[i] || 0) : 0).toFixed(3));
      var ti_cost = parseFloat(Math.abs(d.ti_cost ? (d.ti_cost[i] || 0) : 0).toFixed(5));
      var ti_rate = d.ti_rate ? (d.ti_rate[i] || 0) : 0;
      if (br) {
        var tiExc = ti_cost * rt; excTot[0] += tiExc;
        html += '<td>' + (ti_rate ? (cur + (ti_rate * rt).toFixed(4)) : '—') + '</td><td>' + ti_kwh.toFixed(3) + '</td>' +
                '<td>' + (ti_cost >= 0.000005 ? ((ap ? '≈' : '') + money(tiExc)) : '—') + '</td>' +
                '<td>' + (ti_cost >= 0.000005 ? (cur + ti_cost.toFixed(5)) : '—') + '</td>';
      } else {
        html += '<td>' + (ti_rate ? (cur + ti_rate.toFixed(4)) : '—') + '</td><td>' + ti_kwh.toFixed(3) + '</td>' +
                '<td>' + (ti_cost >= 0.000005 ? (cur + ti_cost.toFixed(5)) : '—') + '</td>';
      }
      orderedKeys.forEach(function (k, ki) {
        var m = d.meters[k], imp = !m.is_export;
        var kwh = parseFloat(Math.abs(m.y[i] || 0).toFixed(3));
        var cost = parseFloat(Math.abs((m.cost && m.cost[i]) || 0).toFixed(5));
        var rr = m.rate, rate = rr[i] !== undefined ? rr[i] : (rr[rr.length - 1] || 0);
        if (br && imp) {
          var ex = cost * rt; excTot[ki + 1] += ex;
          html += '<td>' + (rate ? (cur + (rate * rt).toFixed(4)) : '—') + '</td><td>' + kwh.toFixed(3) + '</td>' +
                  '<td>' + (cost >= 0.000005 ? ((ap ? '≈' : '') + money(ex)) : '—') + '</td>' +
                  '<td>' + (cost >= 0.000005 ? (cur + cost.toFixed(5)) : '—') + '</td>';
        } else {
          html += '<td>' + (rate ? (cur + rate.toFixed(4)) : '—') + '</td><td>' + kwh.toFixed(3) + '</td>' +
                  '<td>' + (cost >= 0.000005 ? (cur + cost.toFixed(5)) : '—') + '</td>';
        }
      });
      html += '</tr>';
    }
    html += '</tbody><tfoot><tr><td>Total</td>';
    var ttk = 0, ttc = 0;
    orderedKeys.forEach(function (k) {
      var t = (d.meter_totals && d.meter_totals[k]) || {kwh: 0, cost: 0};
      if (!d.meters[k].is_export) { ttk += t.kwh; ttc += t.cost; }
    });
    html += br ? '<td></td><td>' + ttk.toFixed(3) + '</td><td>' + cur + excTot[0].toFixed(2) + '</td><td>' + cur + ttc.toFixed(2) + '</td>'
               : '<td></td><td>' + ttk.toFixed(3) + '</td><td>' + cur + ttc.toFixed(2) + '</td>';
    orderedKeys.forEach(function (k, ki) {
      var t = (d.meter_totals && d.meter_totals[k]) || {kwh: 0, cost: 0};
      html += (br && !d.meters[k].is_export)
        ? '<td></td><td>' + t.kwh.toFixed(3) + '</td><td>' + cur + excTot[ki + 1].toFixed(2) + '</td><td>' + cur + t.cost.toFixed(2) + '</td>'
        : '<td></td><td>' + t.kwh.toFixed(3) + '</td><td>' + cur + t.cost.toFixed(2) + '</td>';
    });
    wrap.innerHTML = html + '</tr></tfoot></table></div>';
    wrap._built = true;
  }

  // ── day charts ────────────────────────────────────────────────────────────
  function dark() { return !state.forceLight && document.documentElement.getAttribute('data-theme') !== 'light'; }
  function theme() {                                   // the page's _getThemeColours
    var d = dark();
    return {plotBg: d ? '#1a1d27' : '#f8f9fa', paperBg: d ? '#1a1d27' : '#ffffff',
            axisC: d ? '#6b7080' : '#555566', gridC: d ? '#2a2d3a' : '#e5e5e5'};
  }
  // Axis ranges: the energy axis spans its stacked bars (Plotly's autorange pads ~5%);
  // the rate axis's zero is then aligned with it — the page's _alignY2, unchanged.
  function ranges(d) {
    var n = d.slots, pos = new Array(n).fill(0), neg = new Array(n).fill(0), rmax = 0, rmin = 0;
    var hasImport = false, hasExport = false;
    Object.keys(d.meters).forEach(function (k) {
      var m = d.meters[k];
      m.y.forEach(function (v, i) { if (v > 0) pos[i] += v; else neg[i] += v;
        if (v > 0.001) hasImport = true; if (v < -0.001) hasExport = true; });
      if (m.has_rate) m.rate.forEach(function (v) { if (v > rmax) rmax = v; if (v < rmin) rmin = v; });
    });
    var y1max = Math.max.apply(null, pos) * 1.05, y1min = Math.min.apply(null, neg) * 1.05;
    if (!(y1max > 0)) y1max = hasExport ? 0 : 1;
    var out = {y1: [y1min, y1max], y2: null, ticks: null};
    var y2max = (rmax > 0 ? rmax : 0) * 1.05;
    if (!(y2max > 0)) return out;
    var rawStep = y2max / 4, mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    var step = [1, 2, 2.5, 5, 10].map(function (f) { return f * mag; }).find(function (s) { return s >= rawStep; }) || mag;
    var ticks = [];
    for (var t = 0; t <= y2max + step * 0.01; t += step) ticks.push(parseFloat(t.toFixed(10)));
    var y1top, y2min;
    if (hasExport && !hasImport) {
      var depth = -y1min; y1top = depth * 0.5;
      var frac = depth / (depth + y1top); y2min = -frac * (y2max / (1 - frac));
    } else if (hasImport && hasExport) {
      y1top = y1max;
      var nf = -y1min / (y1max - y1min); y2min = -nf * (y2max / (1 - nf));
    } else {
      y1top = y1max;
      if (rmin < 0) {
        y2min = rmin - (-rmin) * 0.08;
        var f = -y2min / (y2max - y2min); y1min = -(f / (1 - f)) * y1top;
      } else y2min = 0;
    }
    if (y2min < 0) for (var tn = -step; tn >= y2min - step * 0.01; tn -= step) ticks.unshift(parseFloat(tn.toFixed(10)));
    out.y1 = [y1min, y1top]; out.y2 = [y2min, y2max]; out.ticks = ticks;
    return out;
  }
  var plotBg = {id: 'emtPlotBg', beforeDraw: function (ch) {
    var a = ch.chartArea; if (!a) return;
    ch.ctx.save(); ch.ctx.fillStyle = ch.options.plugins.emtPlotBg.color;
    ch.ctx.fillRect(a.left, a.top, a.width, a.height); ch.ctx.restore();
  }};
  function buildChart(day) {
    var row = state.cur && state.cur.dayRows[day], el = state.section && state.section.querySelector('[data-day="' + day + '"] .chart-container');
    if (!row || !el || state.charts[day]) return;
    var d = row.chart, n = d.slots, cur = d.currency, tc = theme(), rg = ranges(d);
    var total = new Array(n).fill(0);
    Object.keys(d.meters).forEach(function (k) { var m = d.meters[k]; if (!m.is_export) m.y.forEach(function (v, i) { total[i] += v; }); });
    var area = d.block_minutes < 15, ds = [];
    Object.keys(d.meters).forEach(function (k) {
      var m = d.meters[k];
      ds.push(area
        ? {type: 'line', label: m.nice_name, data: m.y.map(function (v, i) { return {x: i, y: v}; }), stepped: 'middle',
           fill: 'origin', borderColor: m.bar_color, backgroundColor: m.bar_color, pointRadius: 0, borderWidth: 1,
           yAxisID: 'y', stack: 'kwh', _meter: m, order: 2}
        : {type: 'bar', label: m.nice_name, data: m.y.map(function (v, i) { return {x: i, y: v}; }),
           backgroundColor: m.bar_color, barPercentage: 0.7, categoryPercentage: 1, yAxisID: 'y', stack: 'kwh', _meter: m, order: 2});
      if (m.has_rate) ds.push({type: 'line', label: m.nice_name + ' rate', yAxisID: 'y2', stepped: 'before',
        data: m.rate_x.map(function (x, j) { return {x: x, y: m.rate[j]}; }), borderColor: m.line_color, borderWidth: 2,
        borderDash: m.is_export ? [6, 4] : [], pointRadius: 0, pointHitRadius: 0, fill: false, _meter: m, _rate: true, order: 1});
    });
    // A label every half-hour at full width (the page's tickStep); thinned so rotated
    // labels never overlap on a narrow chart (the page's mobile skip, by width here).
    var every = Math.max(1, Math.round(30 / d.block_minutes));
    var room = Math.max(1, (el.clientWidth || 600) - 110);
    while (n / every * 13 > room) every *= 2;
    var canvas = document.createElement('canvas');
    el.innerHTML = ''; el.appendChild(canvas);
    el.style.background = tc.paperBg;
    state.charts[day] = new Chart(canvas.getContext('2d'), {
      data: {datasets: ds},
      plugins: [plotBg],
      options: {
        animation: false, responsive: true, maintainAspectRatio: false,
        devicePixelRatio: Math.min(2, window.devicePixelRatio || 1),
        interaction: {mode: 'index', intersect: false},
        layout: {padding: {top: 8}},
        plugins: {
          emtPlotBg: {color: tc.plotBg},
          legend: {position: 'bottom', labels: {color: tc.axisC, font: {size: 11}, boxWidth: 12,
                   sort: function (a, b) { return a.datasetIndex - b.datasetIndex; }}},
          tooltip: {callbacks: {
            title: function (items) {
              if (!items.length) return '';
              var x = items[0].raw.x, i = items[0].dataset._rate ? Math.round(x + 0.5) : x;
              return d.x_ranges[Math.min(n - 1, Math.max(0, i))];
            },
            label: function (it) {
              var m = it.dataset._meter, v = it.raw.y;
              if (it.dataset._rate) return m.nice_name + ' rate: ' + cur + v.toFixed(4);
              var i = it.raw.x;
              return m.nice_name + ': ' + Math.abs(v).toFixed(3) + ' kWh' + (m.is_export ? '' : ' (' + total[i].toFixed(3) + ' total)');
            }}}
        },
        scales: {
          x: {type: 'linear', min: -0.5, max: n - 0.5, stacked: true, grid: {display: false},
              afterBuildTicks: function (s) { var t = []; for (var i = 0; i < n; i += every) t.push({value: i}); s.ticks = t; },
              ticks: {color: tc.axisC, autoSkip: false, maxRotation: 45, minRotation: 45, font: {size: 10},
                      callback: function (v) { return d.x_labels[v] || ''; }}},
          // includeBounds:false — the explicit range is padding, not a value to label.
          y: {stacked: true, min: rg.y1[0], max: rg.y1[1], grid: {color: tc.gridC},
              title: {display: true, text: 'kWh', color: tc.axisC, font: {size: 11}},
              ticks: {color: tc.axisC, includeBounds: false}},
          y2: rg.y2 ? {position: 'right', min: rg.y2[0], max: rg.y2[1], grid: {display: false},
                       afterBuildTicks: function (s) { s.ticks = rg.ticks.map(function (v) { return {value: v}; }); },
                       title: {display: true, text: cur + '/kWh', color: tc.axisC, font: {size: 11}},
                       ticks: {color: tc.axisC, callback: function (v) { return v.toFixed(2); }}}
                    : {display: false}
        }
      }
    });
    if (state.corr) bindCorrect(canvas, day);
  }
  function releaseChart(day) {
    var c = state.charts[day]; if (!c) return;
    c.destroy(); delete state.charts[day];
    var el = state.section && state.section.querySelector('[data-day="' + day + '"] .chart-container');
    if (el) el.innerHTML = '';
  }
  function releaseAll() { Object.keys(state.charts).forEach(releaseChart); }

  // ── corrections: one half-hour's rate, or a day's standing charge ─────────
  // Data management design §1 (3), 21 Oct 2026: right-click (or long-press) a day chart for
  // *Correct this rate…*. CAD-only (state.corr, from /api/billing-source's `uses_api`): with
  // the supplier API the bill is the settled figure and a correction has nothing to correct.
  // The routes are /api/corrections/preview and /apply, given {day, slot}; apply takes the
  // required pre-correction backup first.
  var MAIN = 'electricity_main', MAIN_EXP = 'electricity_main_export';
  function bindCorrect(canvas, day) {
    var timer = null, t0 = null;
    function open(evt, x, y) {
      var ch = state.charts[day], row = state.cur && state.cur.dayRows[day];
      if (!ch || !row) return;
      var a = ch.chartArea, r = canvas.getBoundingClientRect(), px = x - r.left, py = y - r.top;
      if (!a || px < a.left || px > a.right || py < a.top || py > a.bottom) return;
      var d = row.chart, i = Math.max(0, Math.min(d.slots - 1, Math.round(ch.scales.x.getValueForPixel(px))));
      var hit = ch.getElementsAtEventForMode(evt, 'nearest', {intersect: true}, false)[0];
      var m = hit && ch.data.datasets[hit.datasetIndex]._meter;
      var exp = m ? !!m.is_export : (ch.scales.y.getValueForPixel(py) < 0 && !!d.meters[MAIN_EXP]);
      var chans = exp ? ['export', 'import'] : ['import', 'export'];
      showMenu(x, y, day, i, chans.filter(function (c) { return d.meters[c === 'export' ? MAIN_EXP : MAIN]; }));
    }
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); open(e, e.clientX, e.clientY); });
    canvas.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) return;
      var tch = e.touches[0]; t0 = {x: tch.clientX, y: tch.clientY};
      timer = setTimeout(function () { timer = null; open(e, t0.x, t0.y); }, 550);
    }, {passive: true});
    canvas.addEventListener('touchmove', function (e) {
      var tch = e.touches[0];
      if (timer && t0 && Math.abs(tch.clientX - t0.x) + Math.abs(tch.clientY - t0.y) > 10) { clearTimeout(timer); timer = null; }
    }, {passive: true});
    ['touchend', 'touchcancel'].forEach(function (k) {
      canvas.addEventListener(k, function () { if (timer) { clearTimeout(timer); timer = null; } }, {passive: true});
    });
  }
  function closeMenu() { var m = document.getElementById('emt-corr-menu'); if (m) m.remove(); }
  function showMenu(x, y, day, i, chans) {
    closeMenu();
    var d = state.cur.dayRows[day].chart, when = i == null ? '' : d.x_ranges[i];
    var menu = document.createElement('div');
    menu.id = 'emt-corr-menu'; menu.className = 'emt-corr-menu'; menu.setAttribute('role', 'menu');

  // vs Prev / vs Last Year: the page's rules. Billing: the period just before in the

  function prevOf(mode, lst, p) {

  // ── sticky bill strip ─────────────────────────────────────────────────────
  var stickyIO = null;

    strip.style.visibility = 'hidden';
    if (!toggle) return;
    state.root.querySelector('#sticky-bill-label').textContent = toggle.querySelector('.bill-toggle-summary').textContent.trim();
    stickyIO = new IntersectionObserver(function (es) {
      var e = es[0], top = e.rootBounds ? e.rootBounds.top : 0;

    }, {root: state.root, threshold: 0});

  // ── the section for one period ────────────────────────────────────────────

  function observeDays(section) {

    }, {root: state.root, rootMargin: '600px 0px'});
    farIO = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (!e.isIntersecting) releaseChart(e.target.dataset.day); });
    }, {root: state.root, rootMargin: '4000px 0px'});

  function col(heading, html, compare) {

    if (p.is_current) card = card.replace('<div class="billing-summary">', '<div class="billing-summary current-period">');
    var cmp = function (q, qb) { return col(heading(mode, q), renderCard(qb.card), true); };
    var vPrev = prev ? cmp(prev.p, prev.b) : emptyCol('No previous period available.');
    var vYear = mode === 'year' ? emptyCol('Not available in year view.')

    var views = {'vanilla': col(ph, card), 'vs-prev': col(ph, card) + vPrev, 'vs-year': col(ph, card) + vYear};

    // did); the longer calendar views start collapsed, summary first.
    var nonCur = lst.shown.filter(function (q) { return !q.is_current; });
    var isPrev = nonCur.length && nonCur[0].start === p.start;
    var open = mode === 'month' ? (p.is_current || isPrev) : false;
    var saved = sget('open.' + mode, null);
    if (saved !== null) open = saved === '1';

    var banner = (mode === 'month' && bill.is_config_change)
      ? '<div class="bill-config-banner">⚙️ <strong>Configuration changed</strong> &mdash; new billing period started ' +
        parseD(p.start).getDate() + ' ' + MON[parseD(p.start).getMonth()] + ' ' + parseD(p.start).getFullYear() + '</div>' : '';
    var el = document.createElement('div');
    el.className = 'period-section ' + mode + '-section';
    el.innerHTML = banner +
      '<details class="bill-toggle" open><summary class="bill-toggle-summary">Bill Summary &mdash; ' + ph + ' &nbsp;|&nbsp; ' +
      total + '</summary><div class="bill-toggle-body">' +
      Object.keys(views).map(function (v) {
        return '<div class="bill-view" data-view="' + v + '" style="display:' + (v === state.view ? 'block' : 'none') + ';">' +
               '<div class="bill-compare-wrap">' + views[v] + '</div></div>'; }).join('') +
      '</div></details>' +
      '<details class="day-charts-toggle"' + (open ? ' open' : '') + '><summary class="day-charts-summary">Daily Charts &mdash; ' +
      ph + ' &nbsp;|&nbsp; ' + total + '</summary><div class="day-charts-body">' +
      days.map(function (day) {

  function show() {

              lst.shown.filter(function (q) { return q.is_current; })[0] || lst.shown[0];

  }
  function mount(sec, html) {

  // ── public ────────────────────────────────────────────────────────────────
  function init(root, opts) {
    state.root = root; state.inited = true;

    if (opts && opts.corrections) fetchJSON('/api/billing-source').then(function (j) {
      state.corr = !j.uses_api;

    state.view = sget('view', 'vanilla');

    state.asc = lget('emt_bill_sort_asc', '0') === '1';
    state.censor = sget('censor', '0') === '1';

    root.appendChild(buildNav());
    var secs = document.createElement('div'); secs.className = 'bill-sections'; root.appendChild(secs);
    // The day's summary panel: its standing charge (the chart's own menu, long-press included, has it too).

    });
    var lbl = root.querySelector('#period-rolodex-label');
    if (window.PeriodSpinner) PeriodSpinner.attach(lbl, {getPeriods: spinnerPeriods, onSelect: selectPeriod});
    // Theme: the charts' colours are baked into their canvases — watch the attribute.

  function rerender() {                                  // new theme or size: redraw what is drawn
    var days = Object.keys(state.charts);

    days.forEach(buildChart);
  }
  // Called when the data has moved (charts.html's data-version poll) and on a
  // dashboard card's timer. Everything cached is dropped, not only the current

  function refresh() {

  function snapshotCharts() {

    state.forceLight = false;

  }
  // PDF: every day's panel (and open table) filled, not only those scrolled to.
  function fillAll() {

  }
  function styles() {
    var s = document.getElementById('emt-billing-styles');

  }

  return {init: init, refresh: refresh, rerender: rerender, snapshotCharts: snapshotCharts, fillAll: fillAll, styles: styles,

          _optionLabel: optionLabel, _loadList: loadList, _loadBill: loadBill, _loadMonth: loadMonth,

})();
