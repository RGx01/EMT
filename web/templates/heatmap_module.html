<!--
  Heatmaps tab, drawn in the browser from /api/energy (workstream C, 30 Sep 2026).

  Replaces the pre-rendered net_heatmap.html iframe (energy_charts.generate_net_heatmap,
  Plotly). Chart.js 4 + chartjs-chart-matrix — Usage Stats already loads Chart.js, and
  this was the test of whether it is enough for the whole Charts page.

  LOOK — v4's, matched deliberately (compared side by side on the Pi, 30 Sep 2026):
    * square cells (v4: 20 px), times at -45° across the top, day numbers down the side;
    * v4's colour stops EXACTLY (make_colorscale / _hmCo2Cs / _hmIntensityCs), over the
      data's own min..max with the background colour at zero — not a symmetric ramp;
      intensity 0..p95 (floor 50 gCO2/kWh);
    * the daily total as horizontal bars on their own scale, weekends shaded behind.
  LAYOUT: one chart per MONTH (square cells make a year ~7,000 px tall — too big for one
  canvas on a phone). Months are drawn as they near the viewport and released when far
  away; each keeps its placeholder height, so scrolling does not jump.
  DATA: /api/energy?resolution=block&kind=month, one request per month; no API shape of
  its own (C §3a). Cached in memory by per-day fingerprint and epoch (C §2a).
  THEME: a MutationObserver on data-theme re-draws every drawn month — it does not rely
  on the page's toggle wiring (a first draft did, and the canvas kept the old colours).
  LOCAL TIME: slots are local half-hours in the SITE timezone; the repeated clocks-back
  hour is SUMMED into its slot (v4 overwrote it); the clocks-forward hour is empty.
-->

  // one month's grid: day -> {slots:[{kwh,co2,int}], total:{kwh,co2}}, days in LOCAL time
  function monthGrid(key) {
    var days = {}, n = slots(), now = Date.now();

      if (b.meter_id !== 'electricity_main') return;
      var lp = localParts(b.block_start);
      if (lp.day.slice(0, 7) !== key) return;                  // a UTC edge of the month
      var d = days[lp.day] || (days[lp.day] = {slots: new Array(n).fill(null), total: {kwh: 0, co2: 0, bill: 0, export: 0, presence: 0}});
      var net = (b.imp_kwh || 0) - (b.exp_kwh || 0), cg = b.carbon_g;

  // Every UTC half-hour of the month inside the data's span — from the first block to the last

    if (!isFinite(lo)) { lo = 0; hi = 1; }
    if (!isFinite(tlo)) { tlo = 0; thi = 1; }
    if (thi === tlo) thi = tlo + 1;
    return {lo: lo, hi: hi, tlo: tlo, thi: thi};
  }
  function cellStops(sc) { return state.metric === 'kwh' ? kwhStops(sc.lo, sc.hi) : state.metric === 'co2' ? co2Stops(sc.lo, sc.hi) : INT_STOPS; }
  function totStops(sc) {
    if (isCat(state.metric)) return [[0, bg()], [1, isSettle(state.metric) ? '#e0a020' : '#cc0000']];
    return state.metric === 'kwh' ? kwhStops(sc.tlo, sc.thi) : co2Stops(sc.tlo, sc.thi);
  }

  // The daily-total column narrows with the screen: v4's 150 px on a desktop, 56 px on a
  // phone. Cells are square and sized from what is left; below CELL_MIN the row scrolls
  // sideways rather than squash them.
  //
  // ONE size for every month (heatmap issues design §4, 17 Oct 2026): measured from the first
  // month's row — every row is the same width — not from the panel being drawn, so months drawn
  // at different moments cannot disagree.
  function rowWidth() {
    var p0 = state.panels[state.keys[0]];
    return p0 ? p0.el.querySelector('.hm-row').clientWidth : 0;
  }
  function totW() {
    if (state.metric === 'intensity') return 0;
    return Math.round(Math.max(56, Math.min(150, rowWidth() * 0.16)));
  }
  function cellSize() {
    var w = rowWidth() - AXIS_LEFT - totW() - 16;
    return Math.max(CELL_MIN, Math.min(CELL_MAX, Math.floor(w / slots())));
  }
  function monthLabel(key) {
    return new Date(+key.slice(0, 4), +key.slice(5, 7) - 1, 1).toLocaleString('en-GB', {month: 'short', year: 'numeric'});
  }
  function daysIn(key) { return new Date(+key.slice(0, 4), +key.slice(5, 7), 0).getDate(); }

  // v4's weekend rows: a translucent band over Saturday and Sunday — across all the
  // slots of the grid (drawn OVER the cells, as v4's overlay trace was; v4 kept that
  // trace for every metric) and behind the daily-total bars.
  function weekendRows(days, hook) {
    var plugin = {id: 'hmWeekend'};
    plugin[hook] = function (ch) {
      var a = ch.chartArea, rh = a.height / days.length, c = ch.ctx;
      c.save(); c.fillStyle = dark() ? 'rgba(0,0,0,0.15)' : 'rgba(0,0,0,0.10)';
      days.forEach(function (d, i) {
        var dow = new Date(d + 'T12:00:00').getDay();
        if (dow === 0 || dow === 6) c.fillRect(a.left, a.top + i * rh, a.width, rh);
      });
      c.restore();
    };
    return plugin;
  }

  // ── issues first: runs of days with nothing to look at fold into one row (§3) ──
  // With "Issues only" on, each run of clean days becomes a fold, which a click expands — a single
  // clean day too (20 Oct 2026, the user: a lone clean day left as a row read as a day with issues). A fold carries its days' half-hours, so a drag that starts or ends on one covers them.
  function foldRows(p, key, days) {
    p.folds = {};
    if (!state.collapse) return days;
    var m = state.metric, out = [], run = [];
    function flush() {
      var oldest = run[run.length - 1], newest = run[0];
      if (run.length && !state.expanded[key + '|' + oldest + '|' + newest]) {
        var id = 'fold:' + oldest + ':' + newest, starts = [];
        run.forEach(function (d) { p.grid[d].slots.forEach(function (c) {
          if (c && c.starts) starts = starts.concat(c.starts); }); });
        starts.sort();
        p.folds[id] = {key: key, from: oldest, to: newest, n: run.length, starts: starts,
                       slots: new Array(slots()).fill(null), total: {kwh: 0, co2: 0, bill: 0, export: 0, presence: 0}};
        out.push(id);
      } else out = out.concat(run);
      run = [];
    }
    days.forEach(function (d) {                                  // newest first
      if (p.grid[d].slots.some(function (c) { return isIssue(c, m); })) { flush(); out.push(d); }
      else run.push(d);
    });
    flush();
    return out;
  }
  function rowOf(p, k) { return (p.folds && p.folds[k]) || p.grid[k]; }
  function foldLabel(f) {
    var a = +f.from.slice(8), b = +f.to.slice(8), mo = monthLabel(f.key).split(' ')[0];
    return (a === b ? a : a + '\u2013' + b) + ' ' + mo;
  }
  function foldText(f) {
    return f.n + (f.n === 1 ? ' day' : ' days') + ' with nothing to look at (' + foldLabel(f) +
      ') \u2014 click to show ' + (f.n === 1 ? 'it' : 'them');
  }
  function expandFold(f) {
    state.expanded[f.key + '|' + f.from + '|' + f.to] = true;
    drawMonth(f.key);
  }
  function foldBands(rows, p) {
    return {id: 'hmFolds', afterDatasetsDraw: function (ch) {
      var a = ch.chartArea, rh = a.height / rows.length, c = ch.ctx;
      c.save();
      rows.forEach(function (k, i) {
        var f = p.folds[k]; if (!f) return;
        c.fillStyle = dark() ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
        c.fillRect(a.left, a.top + i * rh, a.width, rh - 1);
        c.fillStyle = axisC(); c.textAlign = 'center'; c.textBaseline = 'middle';
        c.font = Math.max(6, Math.min(11, Math.floor(rh - 2))) + 'px sans-serif';
        c.fillText(foldText(f), a.left + a.width / 2, a.top + i * rh + rh / 2);
      });
      c.restore();
    }};
  }

  // ── draw one month ─────────────────────────────────────────────────────────
  function drawMonth(key) {
    var p = state.panels[key]; if (!p || !state.months[key]) return;
    p.grid = p.grid || monthGrid(key);
    var days = foldRows(p, key, Object.keys(p.grid).sort().reverse());   // newest at the top
    release(key, true);
    var row = p.el.querySelector('.hm-row');
    if (!days.length) { row.innerHTML = '<div class="hm-empty">No data.</div>'; return; }
    var m = state.metric, sc = state.scale || (state.scale = computeScale()), n = slots();
    var cs = cellSize(), TOT_W = totW(), h = days.length * cs + 2;
    var xs = []; for (var i = 0; i < n; i++) xs.push(slotLabel(i));
    var pts = [];
    days.forEach(function (d) { rowOf(p, d).slots.forEach(function (c, i) { pts.push({x: xs[i], y: d, c: c}); }); });
    // Fixed-size containers and `responsive: true`: Chart.js sizes the canvas to its
    // parent. (With responsive:false it keeps the canvas's default 300x150 and ignores the
    // container — cells came out 5x3 px instead of square.)
    row.innerHTML = '<div class="hm-grid" style="position:relative;height:' + h + 'px;width:' + (n * cs + AXIS_LEFT + 4) +
      'px"><canvas></canvas></div>' + (m === 'intensity' ? '' :
      '<div class="hm-tot" style="position:relative;height:' + h + 'px;width:' + TOT_W + 'px"><canvas></canvas></div>');
    var stops = cellStops(sc);
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    p.chart = new Chart(row.querySelector('.hm-grid canvas').getContext('2d'), {
      type: 'matrix', plugins: [weekendRows(days, 'afterDatasetsDraw'), foldBands(days, p)],
      data: {datasets: [{data: pts, borderWidth: 0,
        backgroundColor: function (ctx) {
          var r = ctx.raw; if (!r) return 'rgba(0,0,0,0)';
          if (isMissing(r.c)) return hatch();                 // every view (§2)
          var v = metricOf(r.c, state.metric);
          return isCat(state.metric) ? settleColour(state.metric, v)
               : paint(stops, sc.lo, sc.hi, v);
        },
        width: function (ctx) { var a = ctx.chart.chartArea; return a ? a.width / n - 1 : cs - 1; },
        height: function (ctx) { var a = ctx.chart.chartArea; return a ? a.height / days.length - 1 : cs - 1; }}]},
      options: {
        animation: false, maintainAspectRatio: false, responsive: true, devicePixelRatio: dpr,
        // Hover is arithmetic on the grid (attachHover), not Chart.js's tooltip, which
        // repaints the whole chart on every pointer move.
        events: [], plugins: {legend: {display: false}, tooltip: {enabled: false}},
        layout: {padding: {right: 2}},
        scales: {
          // No time labels here: they float in one header above every month (drawAxis). The
          // panel that drew them had its plot area shrunk to fit the last rotated label, so its
          // cells came out narrower than every other month's (the user's screenshot, 17 Oct).
          x: {type: 'category', labels: xs, offset: true, grid: {display: false}, display: false},
          // EXPLICIT, not the default: chartjs-chart-matrix's defaults reverse the y axis,
          // which drew the newest day at the BOTTOM while the hover arithmetic counts rows
          // from the top — naming the wrong day. Checked against scale.getPixelForValue.
          y: {type: 'category', labels: days, offset: true, reverse: false, grid: {display: false},
              afterFit: function (s) { s.width = AXIS_LEFT; },
              ticks: {color: axisC(), autoSkip: false, font: {size: 10}, padding: 2,
                      // every day at v4's size; the 1st and every 5th when cells are small
                      callback: function (v, i) { if (p.folds[days[i]]) return '\u22ef';
                        var dn = +days[i].slice(8);
                        return (cs >= 12 || dn === 1 || dn % 5 === 0) ? String(dn) : ''; }}}
        }
      }
    });
    // The rows at their size, measured: Chart.js takes room above and below the plot for the day
    // labels (16 px, measured), out of the box, not beside it. A month of 31 rows lost half a pixel a
    // row; one row — the 1st of a month, or Issues only leaving one — kept 4 px of its 20 (1 Nov 2026,
    // the user's screenshot). The box grows by what was taken, the totals' with it.
    var lost = days.length * cs - p.chart.chartArea.height;
    if (lost > 0.5) {
      h = Math.ceil(h + lost);
      row.querySelectorAll('.hm-grid, .hm-tot').forEach(function (el) { el.style.height = h + 'px'; });
      p.chart.resize();
    }
    // A month too short for its name on its side (one or two rows) is named by its month, in full on hover
    var ml = p.el.querySelector('.hm-mlabel');
    if (ml) {
      ml.textContent = h < 56 ? monthLabel(key).split(' ')[0] : monthLabel(key);
      ml.title = h < 56 ? monthLabel(key) : '';
    }
    if (m !== 'intensity') {
      var ts = totStops(sc), tvals = days.map(function (d) { return rowOf(p, d).total[m]; });
      p.tot = new Chart(row.querySelector('.hm-tot canvas').getContext('2d'), {
        type: 'bar', plugins: [weekendRows(days, 'beforeDatasetsDraw')],
        data: {labels: days, datasets: [{data: tvals, barPercentage: 0.8, categoryPercentage: 1,
          backgroundColor: tvals.map(function (v) { return paint(ts, sc.tlo, sc.thi, v); })}]},
        options: {
          indexAxis: 'y', animation: false, maintainAspectRatio: false, responsive: true, devicePixelRatio: dpr,
          events: [], plugins: {legend: {display: false}, tooltip: {enabled: false}},
          scales: {
            // the range every month shares, so a bar compares across months (it was each
            // month's own); its scale floats in the header (drawAxis)
            // On, but drawing nothing and taking no room: its ticks and pixel mapping are what the
            // header's labels are placed from.
            x: {position: 'top', min: Math.min(0, sc.tlo), max: Math.max(0, sc.thi), grid: {display: false},
                border: {display: false}, afterFit: function (s) { s.height = 0; },
                ticks: {display: false, maxTicksLimit: TOT_W < 100 ? 2 : 4}},
            y: {type: 'category', labels: days, offset: true, reverse: false, display: false}
          }
        }
      });
    }
    if (p.tot) {
      // Align the totals' rows with the grid's, measured rather than assumed: the grid's
      // day labels make Chart.js pad its chart area (8 px at the bottom, measured) and the
      // totals chart has no labels to do the same.
      var ga = p.chart.chartArea, ta = p.tot.chartArea;
      var pb = Math.max(0, ta.bottom - ga.bottom), pt = Math.max(0, ga.top - ta.top);
      if (pb || pt) { p.tot.options.layout = {padding: {top: pt, bottom: pb}}; p.tot.update('none'); }
    }
    p.days = days; p.xs = xs; p.drawn = true;
    attachHover(p);
    drawAxis(p);
    if (state.sel) markSelection(state.sel.from, state.sel.to);   // a month drawn inside it
  }

  // ── the floating axis: the time labels over the grid, the totals' scale over the totals ──
  // One header under the metric bar, sticky as it is, so the axis stays in view whatever month is
  // on screen (the user, 17 Oct 2026). Placed from a drawn month's own chart geometry — every
  // month draws to the same — and kept in step with a row scrolled sideways (narrow screens).
  function drawAxis(p) {
    var ax = state.root && state.root.querySelector('.hm-axis');
    if (!ax || !p || !p.chart) return;
    var bar = state.root.querySelector('.hm-bar');
    ax.style.top = (bar ? bar.offsetHeight : 0) + 'px';
    var inner = ax.querySelector('.hm-axis-in'), base = ax.getBoundingClientRect().left;
    var ga = p.chart.chartArea, gl = p.chart.canvas.getBoundingClientRect().left - base;
    var n = p.xs.length, cw = ga.width / n, cs = cellSize();
    var every = cs >= 18 ? 1 : cs >= 10 ? 2 : 4;           // v4 labelled every slot at 20 px
    var html = '';
    for (var i = 0; i < n; i += every) {
      html += '<span class="hm-ax-t" style="left:' + (gl + ga.left + (i + 0.5) * cw).toFixed(1) + 'px">' +
              p.xs[i] + '</span>';
    }
    if (p.tot) {
      var tx = p.tot.scales.x, tl = p.tot.canvas.getBoundingClientRect().left - base, ta = p.tot.chartArea;
      html += '<span class="hm-ax-title" style="left:' + (tl + ta.left + ta.width / 2).toFixed(1) + 'px">' +
              METRICS[state.metric].tot + '</span>';
      (tx.ticks || []).forEach(function (t) {
        html += '<span class="hm-ax-v" style="left:' + (tl + tx.getPixelForValue(t.value)).toFixed(1) + 'px">' +
                (t.label === undefined ? t.value : t.label) + '</span>';
      });
    }
    inner.innerHTML = html;
    ax.style.color = axisC();
  }
  // a row scrolled sideways takes the others, and the axis, with it
  function syncRows(src) {
    if (state.syncing) return;
    state.syncing = true;
    Object.keys(state.panels).forEach(function (k) {
      var r = state.panels[k].el.querySelector('.hm-row'); if (r !== src) r.scrollLeft = src.scrollLeft;
    });
    state.syncing = false;
    var p = state.panels[state.keys.filter(function (k) { return state.panels[k].drawn; })[0]];
    if (p) drawAxis(p);
  }
  function release(key, keepSize) {
    var p = state.panels[key]; if (!p) return;
    if (p.chart) { p.chart.destroy(); p.chart = null; }
    if (p.tot) { p.tot.destroy(); p.tot = null; }
    p.drawn = false;
    var row = p.el.querySelector('.hm-row');
    if (!keepSize) {                                            // far off screen: free the canvas
      var hgt = row.offsetHeight; row.innerHTML = ''; row.style.height = hgt + 'px';
    } else { row.style.height = ''; }
  }
  function redrawAll(rescale) {
    if (rescale) state.scale = computeScale();
    state.keys.forEach(function (k) { if (state.panels[k] && state.panels[k].drawn) drawMonth(k); });
    var t = state.root && state.root.querySelector('.hm-title');
    if (t) { t.textContent = METRICS[state.metric].title; state.root.querySelector('.hm-sub').textContent = METRICS[state.metric].sub; }
  }

  // ── hover: arithmetic on the grid, an HTML tooltip — the canvas is never repainted ──
  function tipEl() {
    var t = document.getElementById('hm-tip');
    if (!t) { t = document.createElement('div'); t.id = 'hm-tip'; t.className = 'hm-tip'; document.body.appendChild(t); }
    return t;
  }
  function attachHover(p) {
    var row = p.el.querySelector('.hm-row');
    if (row._hmHover) return; row._hmHover = true;
    function show(ev) {
      // no grid: the month is being reloaded (an epoch change dropped it) — nothing to say yet
      var tip = tipEl(); if (!p.drawn || !p.chart || !p.grid) { tip.style.display = 'none'; return; }
      var pt = ev.touches ? ev.touches[0] : ev, mm = METRICS[state.metric], v, lab, day;
      var hitTot = !!(p.tot && p.tot.canvas === ev.target);
      var ch = hitTot ? p.tot : p.chart, a = ch.chartArea, r = ch.canvas.getBoundingClientRect();
      var x = pt.clientX - r.left, y = pt.clientY - r.top;
      if (!a || x < a.left || x > a.right || y < a.top || y > a.bottom) { tip.style.display = 'none'; return; }
      day = p.days[Math.floor((y - a.top) / (a.height / p.days.length))];
      if (!day) { tip.style.display = 'none'; return; }
      if (p.folds && p.folds[day]) {
        tip.innerHTML = foldText(p.folds[day]); tip.style.display = 'block';
        tip.style.left = (pt.clientX + 12) + 'px'; tip.style.top = (pt.clientY + 12) + 'px'; return;
      }
      if (hitTot) { v = p.grid[day].total[state.metric]; lab = mm.tot; }
      else { var ci = Math.floor((x - a.left) / (a.width / p.xs.length));
             v = metricOf(p.grid[day].slots[ci], state.metric); lab = p.xs[ci] + '–' + slotLabel(ci + 1); }
      var hc = hitTot ? null : p.grid[day].slots[ci];
      var txt = (!hitTot && (v === 'missing' || isMissing(hc))) ? missingText(hc)
              : (v === null || v === undefined) ? 'no data'
              : isCat(state.metric) ? (hitTot ? v + ' half-hour' + (v === 1 ? '' : 's') + ' to look at'
                  : CAT_TEXT[state.metric][v] + (((p.grid[day].slots[ci] || {})[state.metric + 'Flags'] || [])
                      .filter(function (x) { return FLAG_TEXT[x]; })
                      .map(function (x) { return '<br>\u26a0 ' + FLAG_TEXT[x]; }).join('')))
              : (+v).toFixed(mm.dp) + mm.unit;
      var inSel = state.sel && !hitTot && hc && hc.starts && hc.starts.some(function (x) {
        return x >= state.sel.from && x < state.sel.to; });
      tip.innerHTML = '<b>' + day + '</b> ' + lab + '<br>' + txt +
        (inSel ? '<br><i>Right-click (long-press) the selection for its actions</i>' : '');
      tip.style.display = 'block'; tip.style.left = (pt.clientX + 12) + 'px'; tip.style.top = (pt.clientY + 12) + 'px';
    }
    row.addEventListener('mousemove', show);
    row.addEventListener('touchstart', show, {passive: true});
    row.addEventListener('mouseleave', function () { tipEl().style.display = 'none'; });
    // A click (or tap) on a cell opens that half-hour's settlement detail (design §4). A drag
    // selects a span — cells to cells, or days down the day column, across months — and a
    // shift-click extends one from the last click; the selection stays outlined, and a right
    // click (a long press on touch) inside it offers its actions (22 Oct 2026, the user: the menu
    // had opened on the release). A right click elsewhere offers the cell's; the day column
    // offers its day (§5.1). Escape lets the selection go.
    row.addEventListener('mousedown', function (ev) {
      if (ev.button !== 0 || !isData()) return;   // a span is for the tools: data mode only
      var h = hitCell(p, ev); if (!h) return;
      ev.preventDefault();                         // no text selection while dragging
      if (ev.shiftKey && state.anchor) return;     // the click extends the selection
      state.drag = {p: p, h: h, span: null};
    });
    row.addEventListener('click', function (ev) {
      var h = hitCell(p, ev); if (!h) return;
      tipEl().style.display = 'none';
      if (state.dragEnded) return;                 // the drag's own release: the selection stays
      if (ev.shiftKey && state.anchor && isData()) {
        var sp = dragSpan(state.anchor, {p: p, h: h});
        if (sp) { state.sel = sp; markSelection(sp.from, sp.to); }
        return;
      }
      state.sel = null; state.anchor = {p: p, h: h};
      if (h.fold) { expandFold(h.fold); return; }
      if (h.tot) { dayBarPick(p, h.day, ev); return; }
      markSelection(h.starts[0], plus30(h.starts[h.starts.length - 1]));
      if (isMissing(p.grid[h.day].slots[h.ci])) { openMissing(p.grid[h.day].slots[h.ci], h.day + ' ' + h.label); return; }
      openPanel(h.starts, h.day + ' ' + h.label);
    });
    row.addEventListener('contextmenu', function (ev) {
      var h = hitCell(p, ev); if (!h) return;
      ev.preventDefault(); tipEl().style.display = 'none';
      if (isData() && inSelection(p, h)) { selectionMenu(ev); return; }
      state.sel = null;                            // a right click elsewhere: that cell, that day
      if (h.fold) { expandFold(h.fold); return; }
      if (h.tot) { dayBarPick(p, h.day, ev); return; }
      markSelection(h.starts[0], plus30(h.starts[h.starts.length - 1]));
      var hc = p.grid[h.day].slots[h.ci];
      var items = [{text: 'Show details', run: function () {
        if (isMissing(hc)) openMissing(hc, h.day + ' ' + h.label); else openPanel(h.starts, h.day + ' ' + h.label); }}];
      if (!isData()) {                             // chart mode: read-only, the tools a click away
        items.push({text: 'Open ' + h.day + ' in Data Management', run: function () { openInDM(h.day); }});
        showMenu(ev, items, h.day + ' ' + h.label);
        return;
      }
      if (state.canRefetch) {
        items.push({text: 'Re-fetch this half-hour from Octopus\u2026', run: function () {
          openRefetch(h.starts[0], plus30(h.starts[h.starts.length - 1]), h.day + ' ' + h.label); }});
        var dr = dayRange(p, h.day);
        if (dr) items.push({text: 'Re-fetch ' + h.day + ' from Octopus\u2026', run: function () {
          markSelection(dr[0], dr[1]); openRefetch(dr[0], dr[1], h.day); }});
      }
      items = items.concat(toolItems(h.starts[0], plus30(h.starts[h.starts.length - 1]), h.day + ' ' + h.label));
      showMenu(ev, items, h.day + ' ' + h.label);
    });
  }
  // The tools on a span, after its re-fetch: fill a gap, fill the missing export, delete the
  // imported export, delete, the support file — one list for a cell, a day and a selection.
  function toolItems(from, to, label) {
    var items = [], f = fillItem(from, to, label); if (f) items.push(f);
    items = items.concat(exportFillItems(from, to));
    var x = exportDeleteItem(from, to); if (x) items.push(x);
    items.push(deleteItem(from, to, label));
    var sf = supportItem(from, to, label); if (sf) items.push(sf);
    return items;
  }
  function inSelection(p, h) {
    var s = state.sel; if (!s) return false;
    var st = h.tot ? (dayRange(p, h.day) || []) : h.starts;
    return !!st && st.some(function (x) { return x >= s.from && x < s.to; });
  }
  function selectionMenu(ev) {
    var sp = state.sel;
    var items = state.canRefetch ? [{text: 'Re-fetch ' + sp.label + ' from Octopus\u2026', run: function () {
      openRefetch(sp.from, sp.to, sp.label); }}] : [];
    showMenu(ev, items.concat(toolItems(sp.from, sp.to, sp.label)), sp.label);
  }

  // the cell (or day bar) under a pointer event: {key, day, ci, label, starts, tot}
  function hitCell(p, ev) {
    if (!p.drawn || !p.chart || !p.grid) return null;
    var tot = !!(p.tot && p.tot.canvas === ev.target), ch = tot ? p.tot : p.chart;

  // ── the settlement detail panel (design §4): the evidence for one half-hour ──

    // an import's kWh and cost are the import's, not a DCC read or a fetched bill (28 Oct 2026)

              : k.origin === 'csv_import' ? 'from the CSV import'
              : k.settled ? (k.dcc !== null && k.stored !== null && Math.abs(k.dcc - k.stored) > 0.0005

      // stored cost is this bill, so no check mark.
      row('bill', esc(gbp(b.cost)), 'v4\u2019s price, ' + esc(kwh(b.kwh)) + ' \u00d7 ' + pence(c.rate) +

                                                 : 'past Octopus\u2019s two years, so it can\u2019t be checked')));

          esc(gbp(c.stored)) + (same ? ' \u2713' : ' \u2717'), same ? '' : 'hm-bad');
      if (b.cost_exc) row('', esc(gbp(b.cost_exc)) + ' ex-VAT',
          'VAT ' + (b.cost_exc > 0.001 ? ((b.cost / b.cost_exc - 1) * 100).toFixed(1) + '%' : '—'));
    } else {
      row('bill', '—', esc(CAT_TEXT.bill[st.bill] || st.bill || ''),
          (st.bill === 'overdue' || st.bill === 'abandoned') ? 'hm-bad' : /^estimate_/.test(st.bill) ? 'hm-wait' : '');
      if (st.bill === 'abandoned' && d.no_cost_since)
        row('', 'not asked since ' + esc(localTime(d.no_cost_since)), '', 'hm-bad');
      row('', esc(gbp(c.stored)), 'stored (kWh \u00d7 rate)');
    }
    var ev = 0, house = 0;
    (d.segments || []).forEach(function (sg) { if (sg.attribution === 'ev') ev += sg.kwh; else house += sg.kwh; });
    if (st.split || d.dispatch) {
      var dn = d.dispatch && d.dispatch.completed_kwh !== null ? 'completed dispatch ' + d.dispatch.completed_kwh + ' kWh'
             : d.dispatch ? 'dispatch ' + esc((d.dispatch.kinds || []).join(', ')) : '';
      row('split', 'EV ' + ev.toFixed(3) + ' / House ' + house.toFixed(3),
          esc(st.split ? CAT_TEXT.split[st.split] : '') + (dn ? ' · ' + dn : ''),
          st.split === 'missing' ? 'hm-bad' : (st.split === 'held' ? 'hm-wait' : ''));
      if (b && b.ev_kwh !== null) row('', 'bill: EV ' + (+b.ev_kwh).toFixed(3) + ' / House ' + (+b.home_kwh).toFixed(3), '');
    }
    var bands = {}; (d.segments || []).forEach(function (sg) { bands[sg.band] = 1; });
    // v4's price, not a rate settled from Octopus's cost
    var rsrc = b && b.origin === 'api_import' ? 'v4\u2019s price' : c.rate_source ? esc(c.rate_source) : '';
    row('rate', pence(c.rate),
        esc(Object.keys(bands).join(', ')) + (rsrc ? ' · ' + rsrc : '') + (c.corrected ? ' · your correction' : ''));
    (st.flags || []).forEach(function (f) { if (FLAG_TEXT[f]) row('\u26a0', esc(FLAG_TEXT[f]), '', 'hm-bad'); });
    // Octopus's band against its own rules (engine step 2b): billed wins, so a note, not an issue
    var bn = d.band, BN = {off_peak: 'off-peak', peak: 'peak'};
    if (bn && bn.disagrees)
      row('band', 'billed ' + esc(BN[bn.settled]), 'Octopus\u2019s rules give ' + esc(BN[bn.predicted]) +
          ' here \u2014 billed wins until Octopus corrects it');
    var x = d.export;
    if (x && (METRICS.export || x.kwh !== null || x.dcc !== null)) {
      var xs = st.export, xv = x.dcc !== null ? x.dcc : x.kwh;
      head('Export');
      row('kWh', xv !== null ? esc(kwh(xv)) : '\u2014', esc(CAT_TEXT.export[xs] || xs || ''),
          (xs === 'overdue' || xs === 'no_data') ? 'hm-bad' : xs === 'waiting' ? 'hm-wait' : '');
      row('earned', x.cost !== null ? esc(gbp(x.cost)) : '\u2014', 'stored (kWh \u00d7 rate)');
      row('rate', pence(x.rate), '');
    }
    var el = panelEl();
    el.innerHTML = '<div class="hm-panel-box" role="dialog" aria-label="Half-hour detail">' +
      '<div class="hm-panel-head"><b>' + esc(label) + '</b><button class="hm-x" data-close="1" aria-label="Close">\u2715</button></div>' +
      '<table class="hm-detail">' + rows.join('') + '</table>' +
      (more ? '<div class="hm-note2">' + esc(more) + '</div>' : '') +
      (!isData() ? '<div class="hm-actions"><button class="hm-btn" data-close="1">Close</button>' +
                   '<a class="hm-btn hm-primary" href="' + dmUrl(localParts(d.start).day) + '">Open in Data Management</a></div>'
       : state.canRefetch ? '<div class="hm-actions">' +
                            // past Octopus's two years there is nothing to re-fetch (28 Oct 2026)
                            (d.reachable === false ? '' : '<button class="hm-btn" data-act="refetch">Re-fetch from Octopus</button>') +
                            '<button class="hm-btn" data-close="1">Close</button></div>' : '') + '</div>';
    el.style.display = 'flex';
    var rb = el.querySelector('[data-act="refetch"]');
    if (rb) rb.onclick = function () { openRefetch(d.start, d.end, label); };
  }
  // a missing half-hour has no block, so no detail to fetch: say what it is
  function openMissing(c, label) {
    var el = panelEl();
    var g = (c && c.gaps) || [], fc = g.length && isData() ? fillItem(g[0], plus30(g[g.length - 1]), label) : null;
    var day = g.length ? localParts(g[0]).day : null;
    el.innerHTML = '<div class="hm-panel-box"><div class="hm-panel-head"><b>' + esc(label) +
                   '</b><button class="hm-x" data-close="1" aria-label="Close">\u2715</button></div>' +
                   '<p>' + (c && c.deleted ? 'Deleted on ' + esc(c.deleted) + ' \u2014 there is no block for this ' +
                   'half-hour.' : 'EMT holds no block for this half-hour: it was never recorded, or not ' +
                   'imported.') + '</p>' +
                   (fc ? '<div class="hm-actions"><button class="hm-btn" data-close="1">Close</button>' +
                         '<button class="hm-btn hm-primary" data-act="fill">Fill this gap\u2026</button></div>'
                    : !isData() && day ? '<div class="hm-actions"><button class="hm-btn" data-close="1">Close</button>' +
                         '<a class="hm-btn hm-primary" href="' + dmUrl(day) + '">Open in Data Management</a></div>' : '') +
                   '</div>';
    el.style.display = 'flex';
    var b = el.querySelector('[data-act="fill"]'); if (b) b.onclick = fc.run;
  }

  function openPanel(starts, label) {
    var el = panelEl();
    el.innerHTML = '<div class="hm-panel-box"><div class="hm-panel-head"><b>' + esc(label) +
                   '</b><button class="hm-x" data-close="1" aria-label="Close">\u2715</button></div>Loading…</div>';
    el.style.display = 'flex';
    fetchJSON('/api/blocks/settlement?start=' + encodeURIComponent(starts[0])).then(function (d) {
      if (d.error) throw new Error(d.error);
      // the clocks-back hour folds two half-hours into one cell: show the first, say so
      renderPanel(d, label, starts.length > 1 ? 'This cell holds ' + starts.length +
                  ' half-hours (the clocks went back); showing the first.' : '');
    }).catch(function (e) {
      el.querySelector('.hm-panel-box').lastChild.textContent = 'Could not load: ' + e.message;
    });
  }

  // ── data ───────────────────────────────────────────────────────────────────
  // At most two months at once, in the order asked (22 Oct 2026, staging: four months loading at
  // once filled every web thread, each classifying and compressing ~2 MB, beside a device rebuild —
  // the engine loop was held 16.9 s). A month is mostly the server's work, so more at once is not
  // faster on a small box, only harder on the engine.
  var FETCH_MAX = 2, fetchQ = [], fetching = 0;
  function fetchMonth(key) {
    return new Promise(function (ok, bad) { fetchQ.push({key: key, ok: ok, bad: bad}); pumpFetches(); });
  }
  function pumpFetches() {
    while (fetching < FETCH_MAX && fetchQ.length) {
      var j = fetchQ.shift(); fetching++;
      fetchMonthNow(j.key).then(j.ok, j.bad).then(function () { fetching--; pumpFetches(); });
    }
  }
  function fetchMonthNow(key) {
    var y = key.slice(0, 4), mo = +key.slice(5, 7);
    var inc = '&include=' + (METRICS.bill ? 'settle,' : '') + 'gaps';
    return fetchJSON('/api/energy?resolution=block&kind=month&year=' + y + '&month=' + mo + inc).then(function (r) {
      if (r.error) throw new Error(r.error);
      state.tz = state.tz || r.timezone;
      var stale = [];
      if (state.epoch !== null && r.fingerprint.epoch !== state.epoch) {   // bulk change: drop the cache
        state.months = {}; Object.keys(state.panels).forEach(function (k) { state.panels[k].grid = null; });
        // ...and fetch again every other month still on screen: left drawn with no grid, its hover and
        // click read p.grid[day] from null until the page was reloaded (24 Oct 2026, Data Management)
        stale = Object.keys(state.panels).filter(function (k) { return k !== key && state.panels[k].drawn; });
      }
      state.epoch = r.fingerprint.epoch;
      state.months[key] = {blocks: r.blocks || [], settle: r.settle || {}, deleted: r.deleted || [],
                           range: r.range || null, fp: JSON.stringify(r.fingerprint.days)};
      if (state.panels[key]) state.panels[key].grid = null;
      stale.forEach(function (k) { loadMonth(k); });
    });
  }
  function loadMonth(key) {
    if (state.loading[key]) return state.loading[key];
    var p = state.panels[key], t0 = performance.now();
    var need = state.months[key] ? Promise.resolve() : fetchMonth(key);
    return (state.loading[key] = need.then(function () {
      var t1 = performance.now();
      p.grid = p.grid || monthGrid(key);
      var before = state.scale ? JSON.stringify(state.scale) : null, after = computeScale();
      state.scale = after;
      if (before && before !== JSON.stringify(after)) redrawAll(false);    // the range widened
      drawMonth(key);
      p.timing = {fetch_ms: Math.round(t1 - t0), draw_ms: Math.round(performance.now() - t1)};
      delete state.loading[key];
    }).catch(function (e) {
      p.el.querySelector('.hm-row').innerHTML = '<div class="hm-empty">Could not load ' + monthLabel(key) + ': ' + e.message + '</div>';
      delete state.loading[key];
    }));
  }

  // Switch the view (a metric button, or the health strip's figures on Data Management)
  function setMetric(k) {
    if (!METRICS[k] || !state.root) return;
    state.metric = k; state.mexpanded = {};
    state.root.querySelectorAll('.hm-metrics button:not(.hm-collapse)').forEach(function (x) {
      x.classList.toggle('active', x.dataset.metric === k); });
    foldMonths();
    redrawAll(true);
  }
  // The health strip's count for a view (data management design §1 (2)): the server's half-hours
  // by state — `state` or `state|flag,flag` — through this module's own settleValue and isIssue,
  // so the strip and the grid cannot disagree.
  function issueCount(view, counts) {
    var n = 0;
    Object.keys(counts || {}).forEach(function (key) {
      var parts = key.split('|'), c = {};
      c[view] = view === 'bill' ? settleValue('bill', {bill: parts[0], flags: parts[1] ? parts[1].split(',') : []})
                                : parts[0];
      if (isIssue(c, view)) n += counts[key];
    });
    return n;
  }
  function buildUI() {
    var root = state.root;
    root.innerHTML = '<div class="hm-bar"><div class="hm-metrics"></div>' +
      '<span class="hm-note">Local time · newest first</span></div>' +
      '<div class="hm-head"><div class="hm-title"></div><div class="hm-sub"></div></div>' +
      '<div class="hm-axis"><div class="hm-axis-in"></div></div><div class="hm-months"></div>';
    var mb = root.querySelector('.hm-metrics');
    Object.keys(METRICS).forEach(function (k) {
      var b = document.createElement('button'); b.className = 'hm-metric-btn' + (k === state.metric ? ' active' : '');
      b.textContent = METRICS[k].label; b.title = METRICS[k].title;
      b.dataset.metric = k;
      b.onclick = function () { setMetric(k); };
      mb.appendChild(b);
    });
    // "Issues only" (§3): fold the days with nothing to look at; remembered per browser. Data
    // mode only — Charts is a chart (data management design §1 (1)).
    if (!isData()) return buildMonths(root);
    var fb = document.createElement('button');
    fb.className = 'hm-metric-btn hm-collapse' + (state.collapse ? ' active' : '');
    fb.textContent = 'Issues only';
    fb.title = 'Fold the days with nothing to look at; click a fold to show its days';
    fb.onclick = function () {
      state.collapse = !state.collapse; state.expanded = {}; state.mexpanded = {};
      fb.classList.toggle('active', state.collapse);
      try { localStorage.setItem('emt_hm_collapse', state.collapse ? '1' : '0'); } catch (e) {}
      foldMonths();
      redrawAll(false);
    };
    mb.appendChild(fb);
    buildMonths(root);
  }
  function buildMonths(root) {
    var wrap = root.querySelector('.hm-months');
    // Draw near the viewport; release far from it (a month's canvases at 2x are ~10 MB).
    var near = new IntersectionObserver(function (ents) {
      ents.forEach(function (e) { var k = e.target.dataset.key;
        if (e.isIntersecting && !state.panels[k].drawn) loadMonth(k); });
    }, {rootMargin: '800px'});
    var far = new IntersectionObserver(function (ents) {
      ents.forEach(function (e) { var k = e.target.dataset.key;
        if (!e.isIntersecting && state.panels[k].drawn) release(k, false); });
    }, {rootMargin: '4000px'});
    state.keys.forEach(function (k, i) {
      var el = document.createElement('section'); el.className = 'hm-month'; el.dataset.key = k;
      var guess = daysIn(k) * 18;
      el.innerHTML = '<div class="hm-mlabel">' + monthLabel(k) + '</div><div class="hm-row" style="height:' + guess + 'px"></div>';
      el.querySelector('.hm-row').addEventListener('scroll', function (e) { syncRows(e.target); }, {passive: true});
      wrap.appendChild(el); state.panels[k] = {el: el, first: i === 0};
      // Never make the first month wait on an intersection event — a page that is not
      // visible yet (a background tab, a hidden pane) reports none.
      if (i === 0) loadMonth(k);
      near.observe(el); far.observe(el);
    });
    reachRow();
    foldMonths();
    redrawAll(false);
    // Theme: watch the attribute itself, so any toggle from any code path re-draws.
    new MutationObserver(function () { redrawAll(true); })
      .observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
    // Width: square cells are sized from it.
    // Any change, not only one of 8 px or more: a scrollbar appearing is ~15 px on some systems
    // and less on others, and every month must draw to the one width.
    var lastW = root.clientWidth, rt = null;
    new ResizeObserver(function () {
      if (root.clientWidth === lastW) return; lastW = root.clientWidth;
      clearTimeout(rt); rt = setTimeout(function () { redrawAll(false); }, 150);
    }).observe(root);
  }

  // ── Issues only, a month at a time (21 Oct 2026, the user): a month with nothing to look at in the
  // view folds, a run of them into one line, which a click shows. From the health strip's counts by
  // month (/api/data-health, cached on the server), so a clean month is never fetched to find out.
  // The newest month is live and always shown; so is the month ?day= opens. A month the counts do
  // not name has no half-hour in any state and none missing (a month inside the history with no
  // blocks counts its half-hours missing), so it is clean: CAD-only's counts name only the months
  // with something missing.
  function monthClean(k) {
    if (!isData() || !state.collapse || !state.mhealth || state.mexpanded[k]) return false;
    if (k === state.keys[0] || (state.dayWanted && k === state.dayWanted.slice(0, 7))) return false;
    var h = state.mhealth[k] || {};
    var miss = h.missing || 0;
    if (state.metric === 'presence') return miss === 0;
    if (!isSettle(state.metric)) return false;
    return miss === 0 && issueCount(state.metric, h[state.metric] || {}) === 0;
  }
  function foldMonths() {
    var wrap = state.root && state.root.querySelector('.hm-months'); if (!wrap) return;
    wrap.querySelectorAll('.hm-mfold').forEach(function (x) { x.remove(); });
    var run = [];
    function flush() {
      if (!run.length) return;
      var ks = run.slice(), el = document.createElement('button');
      el.className = 'hm-mfold'; el.type = 'button';
      var lab = ks.length === 1 ? monthLabel(ks[0]) : monthLabel(ks[ks.length - 1]) + ' \u2013 ' + monthLabel(ks[0]);
      el.textContent = lab + ': nothing to look at \u2014 click to show';
      el.onclick = function () { ks.forEach(function (k) { state.mexpanded[k] = true; }); foldMonths(); };
      wrap.insertBefore(el, state.panels[ks[0]].el);
      run = [];
    }
    state.keys.forEach(function (k) {
      var p = state.panels[k]; if (!p) return;
      var clean = monthClean(k);
      p.el.style.display = clean ? 'none' : '';
      if (clean) run.push(k); else flush();
    });
    flush();
  }

  // Octopus's history before EMT's oldest block (decided 18 Oct 2026, the user): its own row below
  // the oldest month, not hatched and not an issue — never recorded is not missing. It links to the
  // Historical import's API import, which fills it.
  function reachRow() {
    var wrap = state.root && state.root.querySelector('.hm-months'); if (!wrap) return;
    var el = wrap.querySelector('.hm-reach'), r = (state.bounds || {}).reach_from;
    if (!(state.canRefetch && r)) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.className = 'hm-reach'; }
    wrap.appendChild(el);                                         // after the oldest month
    var d = '';
    try { d = new Intl.DateTimeFormat('en-GB', {timeZone: state.tz, day: 'numeric', month: 'long', year: 'numeric'})
                .format(new Date(r + 'Z')); } catch (e) { d = r.slice(0, 10); }
    el.innerHTML = 'Octopus holds your data back to <b>' + esc(d) + '</b> \u2014 ' +
                   '<a href="' + apiUrl('/historical-import#api-import-panel') + '">import it</a>';
  }

  var HEALTH_WAIT_MS = 1500;
  function loadMonthHealth() {
    return fetchJSON('/api/data-health').then(function (d) {
      state.mhealth = (d && d.ok && d.months) || null;
      foldMonths();                                // a no-op before the months are built
    }, function () { state.mhealth = null; });
  }

  // `opts.mode`: 'chart' (the default — Charts, the Lovelace card) or 'data' (Data Management);
  // `opts.day`: in data mode, 'YYYY-MM-DD' to open that day's month and mark the day.
  // `opts.issues`: in data mode, Issues only on for this visit.
  function init(root, opts) {
    opts = opts || {};
    state.root = root || document.getElementById('chart-heatmap-content');
    if (state.inited) return refresh();
    state.inited = true;
    state.mode = opts.mode === 'data' ? 'data' : 'chart';
    state.dayWanted = isData() && /^\d{4}-\d{2}-\d{2}$/.test(opts.day || '') ? opts.day : null;
    state.onChange = typeof opts.onChange === 'function' ? opts.onChange : null;
    // `opts.onSupportFile(from, to, label)` (data mode): the selection's "Make a support file…"
    state.onSupportFile = typeof opts.onSupportFile === 'function' ? opts.onSupportFile : null;
    state.root.innerHTML = '<div class="hm-empty">Loading…</div>';
    var apiCheck = Promise.resolve();
    if (isData()) {
      // the data views, not the energy ones; Issues only on unless turned off in this browser
      Object.keys(METRICS).forEach(function (k) { delete METRICS[k]; });
      try { state.collapse = localStorage.getItem('emt_hm_collapse') !== '0'; } catch (e) { state.collapse = true; }
      // `opts.issues` (BL-95, the settlement pill's way in): Issues only on for this visit, the
      // browser's own choice left as it was
      if (opts.issues) state.collapse = true;
      // The settlement views are for supplier-API accounts only; ask once, and a failed
      // answer means "not shown", never an error for the heatmap.
      apiCheck = fetchJSON('/api/billing-source').then(function (r) {
        if (!(r && r.uses_api)) return;
        state.canRefetch = true;                // BL-86: a re-fetch needs the supplier API
        (r.settle_views || []).forEach(function (k) { if (SETTLE_METRICS[k]) METRICS[k] = SETTLE_METRICS[k]; });
      }, function () {}).then(function () {
        // Missing only where there is no bill view (21 Oct 2026, the user): with the API, a missing
        // half-hour is an issue in the Import and Export bill views already; CAD-only has no other.
        if (!METRICS.bill && !METRICS.export) METRICS.presence = PRESENCE_METRIC;
        state.metric = METRICS.bill ? 'bill' : METRICS.export ? 'export' : 'presence';
        // The month counts fold clean months before they are drawn; the grid waits for them only
        // so long (21 Oct 2026: a first count after new data is seconds on the Pi), and folds
        // them when they come.
        return Promise.race([loadMonthHealth(), new Promise(function (r) { setTimeout(r, HEALTH_WAIT_MS); })]);
      });
    }
    return libs().then(function () { return apiCheck; })
      .then(function () { return fetchJSON('/api/periods?kind=month'); }).then(function (p) {
      var b = p.bounds || {};
      if (!b.earliest) { state.root.innerHTML = '<div class="hm-empty">No heatmap data yet.</div>'; return; }
      state.tz = p.timezone || state.tz; state.bounds = b; state.keys = [];
      var y = +b.latest.slice(0, 4), mo = +b.latest.slice(5, 7), stop = b.earliest.slice(0, 7);
      for (;;) {
        var k = y + '-' + (mo < 10 ? '0' : '') + mo; state.keys.push(k);
        if (k <= stop) break; mo--; if (mo < 1) { mo = 12; y--; }
      }
      buildUI();
      if (state.dayWanted) openDay(state.dayWanted);
    }).catch(function (e) { state.root.innerHTML = '<div class="hm-empty">Heatmap unavailable: ' + e.message + '</div>'; });
  }

  // `?day=` (data management design §1 (1)): draw every month from the newest down to the day's —
  // only those above it move it, and Issues only folds them far shorter than their placeholders —
  // then open the day if it is folded, mark it as a selection, and scroll it in under the view bar.
  function openDay(day) {
    var key = day.slice(0, 7), p = state.panels[key], i = state.keys.indexOf(key);
    if (!p || i < 0) return;
    return Promise.all(state.keys.slice(0, i + 1).map(function (k) { return loadMonth(k); })).then(function () {
      var f = p.folds && Object.keys(p.folds).map(function (k) { return p.folds[k]; })
                .filter(function (x) { return day >= x.from && day <= x.to; })[0];
      if (f) expandFold(f);
      var dr = dayRange(p, day);
      if (dr) markSelection(dr[0], dr[1]);
      scrollToRow(p, day);
    });
  }
  function scrollToRow(p, day) {
    var box = scrollParent(state.root), a = p.chart && p.chart.chartArea;
    var ri = p.days ? p.days.indexOf(day) : -1, rh = a && p.days ? a.height / p.days.length : 0;
    var grid = p.el.querySelector('.hm-grid') || p.el;
    var top = grid.getBoundingClientRect().top + (a ? a.top : 0) + (ri > 0 ? ri * rh : 0);
    // below both sticky headers: the view bar and the time axis under it
    var under = 0;
    ['.hm-bar', '.hm-axis'].forEach(function (q) {
      var e = state.root.querySelector(q); if (e) under = Math.max(under, e.getBoundingClientRect().bottom); });
    if (box === document.scrollingElement || box === document.body) window.scrollBy(0, top - under - 24);
    else box.scrollTop += top - Math.max(under, box.getBoundingClientRect().top) - 24;
  }
  function scrollParent(el) {
    for (var n = el && el.parentElement; n; n = n.parentElement) {
      var o = getComputedStyle(n).overflowY;
      if ((o === 'auto' || o === 'scroll') && n.scrollHeight > n.clientHeight) return n;
    }
    return document.scrollingElement || document.body;
  }

  // Re-fetch the current month (where change happens, C §2a), and every other DRAWN month whose
  // per-day fingerprints moved — asked cheaply (fields=days), so only a month that changed is
  // re-fetched. Until 18 Oct 2026 only the current month was asked: bills applied to August by
  // the history drain turned it green in the store and never on the page. A cached month not
  // drawn is dropped, to be fetched afresh when it scrolls near.
  function refresh() {
    var k = state.keys[0]; if (!k) return Promise.resolve();
    if (isData()) loadMonthHealth().then(foldMonths);     // a write may clean, or dirty, a month
    var before = state.months[k] && state.months[k].fp, ep = state.epoch;
    return fetchMonth(k).then(function () {
      // A bulk change (a restore, an import, a delete) moved the epoch: fetchMonth emptied the
      // cache, so every drawn month is re-fetched — redrawAll alone redraws only cached months,
