<!--
  Heatmaps tab, drawn in the browser from /api/energy (workstream C, 30 Sep 2026).

  Replaces the pre-rendered net_heatmap.html iframe (energy_charts.generate_net_heatmap,
  Plotly). Chart.js 4 + chartjs-chart-matrix — Usage Stats already loads Chart.js, and
  this was the test of whether it is enough for the whole Charts page.

  LOOK — v4's, matched deliberately (compared side by side on the Pi, 30 Sep 2026):
    * square cells (v4: 20 px), times at -45° across the top, day numbers down the side;
    * v4's colour stops EXACTLY (make_colorscale / _hmCo2Cs / _hmIntensityCs), over the
      data's own min..max with the background colour at zero — not a symmetric ramp;
      intensity 0..p95 (floor 50 gCO2/kWh);
    * the daily total as horizontal bars on their own scale, weekends shaded behind.
  LAYOUT: one chart per MONTH (square cells make a year ~7,000 px tall — too big for one
  canvas on a phone). Months are drawn as they near the viewport and released when far
  away; each keeps its placeholder height, so scrolling does not jump.
  DATA: /api/energy?resolution=block&kind=month, one request per month; no API shape of
  its own (C §3a). Cached in memory by per-day fingerprint and epoch (C §2a).
  THEME: a MutationObserver on data-theme re-draws every drawn month — it does not rely
  on the page's toggle wiring (a first draft did, and the canvas kept the old colours).
  LOCAL TIME: slots are local half-hours in the SITE timezone; the repeated clocks-back
  hour is SUMMED into its slot (v4 overwrote it); the clocks-forward hour is empty.
-->
<script>
window.EMTHeatmap = (function () {
  var PLUGIN = 'https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.0.1/dist/chartjs-chart-matrix.min.js';
  var CHARTJS = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js';
  var METRICS = {
    kwh:       {label: 'kWh',      title: 'Net Energy (kWh)',  sub: 'Energy imported minus exported, each half-hour',
                unit: ' kWh', dp: 3, tot: 'Daily Total'},
    co2:       {label: 'gCO₂',     title: 'Carbon (gCO₂)',     sub: 'Emissions from what you drew, net of what you exported',
                unit: ' gCO₂', dp: 1, tot: 'Daily CO₂'},
    intensity: {label: 'gCO₂/kWh', title: 'Grid Carbon Intensity (gCO₂/kWh)',
                sub: 'How clean the grid was, regardless of your usage', unit: ' gCO₂/kWh', dp: 0, tot: null}
  };
  // Supplier-API accounts only (added in init when /api/billing-source says uses_api):
  // which half-hours still have no smart-meter (DCC) kWh from the API. Imported history
  // is excluded — it was accepted as the record when it came in. A reading normally
  // lands in 1–2 days, so a gap under API_PENDING_H is "not yet", not "missing".
  // One view per channel the API supplies (export settles separately, and later).
  var API_SUB = 'Half-hours without a smart-meter reading from the API: amber under 48 h (normally 1–2 days), ' +
                'red after · green received · grey imported history, excluded';
  var API_METRICS = {
    api:    {label: 'API import', title: 'API usage data — import kWh from the supplier', sub: API_SUB,
             unit: '', dp: 0, tot: 'Missing', field: 'kwh_authoritative', channel: 'import'},
    apiexp: {label: 'API export', title: 'API usage data — export kWh from the supplier', sub: API_SUB,
             unit: '', dp: 0, tot: 'Missing', field: 'exp_kwh_authoritative', channel: 'export'}
  };
  function isApi(m) { return m === 'api' || m === 'apiexp'; }
  var API_PENDING_H = 48;
  var API_RANK = {imported: 0, ok: 1, pending: 2, missing: 3};      // a clocks-back slot shows the worst
  var API_TEXT = {ok: 'API kWh received', pending: 'no API kWh yet (under 48 h)', missing: 'no API kWh',
                  imported: 'imported history (excluded)'};
  function apiColour(v) {
    if (v === 'ok') return '#2e9e5b';
    if (v === 'pending') return '#e0a020';
    if (v === 'missing') return '#cc0000';
    if (v === 'imported') return dark() ? '#3a3e4a' : '#d4d7de';
    return 'rgba(0,0,0,0)';
  }
  var AXIS_TOP = 46, AXIS_LEFT = 30, CELL_MAX = 22, CELL_MIN = 6;
  var state = {metric: 'kwh', tz: null, bm: 30, months: {}, keys: [], panels: {}, epoch: null,
               root: null, inited: false, loading: {}, scale: null, forceLight: false};
  var fetchJSON = function (url) { return fetch(apiUrl(url)).then(function (r) { return r.json(); }); };

  function loadScript(src) {
    return new Promise(function (ok, bad) {
      if (document.querySelector('script[src="' + src + '"]')) { ok(); return; }
      var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad;
      document.head.appendChild(s);
    });
  }
  function libs() {
    var p = window.Chart ? Promise.resolve() : loadScript(CHARTJS);
    return p.then(function () {
      return (window.Chart && Chart.registry.controllers.get('matrix')) ? null : loadScript(PLUGIN);
    });
  }
  function dark() {
    if (state.forceLight) return false;                  // PDF snapshot prints on white
    return document.documentElement.getAttribute('data-theme') !== 'light';
  }
  function bg() { return dark() ? '#1a1d27' : '#ffffff'; }         // v4's zero colour, per theme
  function axisC() { return dark() ? '#6b7080' : '#555566'; }

  // ── v4's colour scales, exactly ───────────────────────────────────────────
  function hex(c) { c = c.replace('#', ''); return [parseInt(c.slice(0, 2), 16), parseInt(c.slice(2, 4), 16), parseInt(c.slice(4, 6), 16)]; }
  function kwhStops(mn, mx) {                           // energy_charts.make_colorscale
    var W = bg();
    if (mx === mn) mx = mn + 1;
    var wp = Math.max(0, Math.min(1, (0 - mn) / (mx - mn)));
    if (wp <= 0.01) return [[0, W], [0.33, '#ffcc99'], [0.66, '#ff6600'], [1, '#cc0000']];
    if (wp >= 0.99) return [[0, '#003366'], [0.33, '#0066cc'], [0.66, '#00aa66'], [1, W]];
    return [[0, '#003366'], [wp * 0.33, '#0066cc'], [wp * 0.66, '#00aa66'], [wp, W],
            [wp + (1 - wp) * 0.33, '#ffcc99'], [wp + (1 - wp) * 0.66, '#ff6600'], [1, '#cc0000']];
  }
  function co2Stops(mn, mx) {                           // _hmCo2Cs
    var W = bg();
    if (mn >= 0) return [[0, W], [0.5, '#ff9966'], [1, '#cc0000']];
    if (mx <= 0) return [[0, '#1a6632'], [0.5, '#66bb88'], [1, W]];
    var wp = Math.max(0.01, Math.min(0.99, (0 - mn) / (mx - mn)));
    return [[0, '#1a6632'], [wp * 0.5, '#66bb88'], [wp, W], [wp + (1 - wp) * 0.5, '#ff9966'], [1, '#cc0000']];
  }
  var INT_STOPS = [[0, '#1a6632'], [0.25, '#52b788'], [0.5, '#f9c74f'], [0.75, '#f3722c'], [1, '#cc0000']];
  function paint(stops, mn, mx, v) {
    if (v === null || v === undefined) return 'rgba(0,0,0,0)';
    var t = mx > mn ? (v - mn) / (mx - mn) : 0.5; t = Math.max(0, Math.min(1, t));
    for (var i = 1; i < stops.length; i++) {
      if (t <= stops[i][0] || i === stops.length - 1) {
        var a = stops[i - 1], b = stops[i], span = b[0] - a[0], u = span > 0 ? Math.min(1, (t - a[0]) / span) : 0;
        var A = hex(a[1]), B = hex(b[1]);
        return 'rgb(' + [0, 1, 2].map(function (k) { return Math.round(A[k] + (B[k] - A[k]) * u); }).join(',') + ')';
      }
    }
    return stops[stops.length - 1][1];
  }

  // ── local wall-clock parts in the site timezone, memoised per UTC half-hour ──
  var _fmt = null, _memo = {};
  function localParts(utcIso) {
    var hit = _memo[utcIso]; if (hit) return hit;
    if (!_fmt) _fmt = new Intl.DateTimeFormat('en-GB', {timeZone: state.tz, year: 'numeric',
      month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'});
    var p = {}; _fmt.formatToParts(new Date(utcIso + 'Z')).forEach(function (x) { p[x.type] = x.value; });
    var out = {day: p.year + '-' + p.month + '-' + p.day, slot: Math.floor((+p.hour * 60 + +p.minute) / state.bm)};
    _memo[utcIso] = out; return out;
  }
  function slotLabel(i) {
    var m = i * state.bm, h = Math.floor(m / 60) % 24, mm = m % 60;
    return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm;
  }
  function slots() { return Math.round(1440 / state.bm); }

  // one month's grid: day -> {slots:[{kwh,co2,int}], total:{kwh,co2}}, days in LOCAL time
  function monthGrid(key) {
    var days = {}, n = slots(), now = Date.now();
    (state.months[key].blocks || []).forEach(function (b) {
      if (b.meter_id !== 'electricity_main') return;
      var lp = localParts(b.block_start);
      if (lp.day.slice(0, 7) !== key) return;                  // a UTC edge of the month
      var d = days[lp.day] || (days[lp.day] = {slots: new Array(n).fill(null), total: {kwh: 0, co2: 0, api: 0, apiexp: 0}});
      var net = (b.imp_kwh || 0) - (b.exp_kwh || 0), cg = b.carbon_g;
      var c = d.slots[lp.slot] || (d.slots[lp.slot] = {kwh: 0, co2: null, int: null});
      c.kwh += net;                                             // clocks-back: summed
      if (cg !== null && cg !== undefined) c.co2 = (c.co2 || 0) + cg;
      // The payload states the grid's intensity per block (carbon.slot_intensity).
      if (b.carbon_intensity_g !== null && b.carbon_intensity_g !== undefined) c.int = b.carbon_intensity_g;
      // API coverage, per channel: the payload's kwh_authoritative / exp_kwh_authoritative
      // is "imported, or that channel's DCC kWh held".
      var imported = /^imported/.test(b.source || ''), young = now - Date.parse(b.block_start + 'Z') < API_PENDING_H * 3600e3;
      Object.keys(API_METRICS).forEach(function (k) {
        var st = imported ? 'imported' : b[API_METRICS[k].field] ? 'ok' : young ? 'pending' : 'missing';
        if (!c[k] || API_RANK[st] > API_RANK[c[k]]) c[k] = st;
      });
      d.total.kwh += net; if (cg) d.total.co2 += cg;
    });
    Object.keys(days).forEach(function (k) {                      // the day's half-hours still owed
      Object.keys(API_METRICS).forEach(function (m) {
        days[k].total[m] = days[k].slots.filter(function (c) {
          return c && (c[m] === 'missing' || c[m] === 'pending'); }).length;
      });
    });
    return days;
  }
  function metricOf(c, m) { return c ? (m === 'kwh' ? c.kwh : m === 'co2' ? c.co2 : isApi(m) ? c[m] : c.int) : null; }

  // The range every drawn month shares, so months are comparable: over all LOADED months.
  // It can widen as older months load; drawn months are re-coloured when it does.
  function computeScale() {
    var m = state.metric, lo = Infinity, hi = -Infinity, tlo = Infinity, thi = -Infinity, ints = [];
    if (isApi(m)) {                     // categorical cells; the bar counts from 0 to the worst day
      var worst = 1;
      Object.keys(state.panels).forEach(function (k) {
        var g = state.panels[k].grid; if (!g) return;
        Object.keys(g).forEach(function (d) { worst = Math.max(worst, g[d].total[m]); });
      });
      return {lo: 0, hi: 1, tlo: 0, thi: worst};
    }
    Object.keys(state.panels).forEach(function (k) {
      var g = state.panels[k].grid; if (!g) return;
      Object.keys(g).forEach(function (d) {
        g[d].slots.forEach(function (c) {
          var v = metricOf(c, m); if (v === null || v === undefined) return;
          if (m === 'intensity') ints.push(v); else { lo = Math.min(lo, v); hi = Math.max(hi, v); }
        });
        if (m !== 'intensity') { var t = g[d].total[m]; tlo = Math.min(tlo, t); thi = Math.max(thi, t); }
      });
    });
    if (m === 'intensity') {                                    // v4: p95, floor 50, else 300
      ints.sort(function (a, b) { return a - b; });
      var mx = ints.length ? Math.max(ints[Math.floor(0.95 * (ints.length - 1))], 50) : 300;
      return {lo: 0, hi: mx, tlo: 0, thi: 1};
    }
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    if (!isFinite(tlo)) { tlo = 0; thi = 1; }
    if (thi === tlo) thi = tlo + 1;
    return {lo: lo, hi: hi, tlo: tlo, thi: thi};
  }
  function cellStops(sc) { return state.metric === 'kwh' ? kwhStops(sc.lo, sc.hi) : state.metric === 'co2' ? co2Stops(sc.lo, sc.hi) : INT_STOPS; }
  function totStops(sc) {
    if (isApi(state.metric)) return [[0, bg()], [1, '#cc0000']];
    return state.metric === 'kwh' ? kwhStops(sc.tlo, sc.thi) : co2Stops(sc.tlo, sc.thi);
  }

  // The daily-total column narrows with the screen: v4's 150 px on a desktop, 56 px on a
  // phone. Cells are square and sized from what is left; below CELL_MIN the row scrolls
  // sideways rather than squash them.
  function totW(panel) {
    if (state.metric === 'intensity') return 0;
    var w = panel.el.querySelector('.hm-row').clientWidth;
    return Math.round(Math.max(56, Math.min(150, w * 0.16)));
  }
  function cellSize(panel) {
    var w = panel.el.querySelector('.hm-row').clientWidth - AXIS_LEFT - totW(panel) - 16;
    return Math.max(CELL_MIN, Math.min(CELL_MAX, Math.floor(w / slots())));
  }
  function monthLabel(key) {
    return new Date(+key.slice(0, 4), +key.slice(5, 7) - 1, 1).toLocaleString('en-GB', {month: 'short', year: 'numeric'});
  }
  function daysIn(key) { return new Date(+key.slice(0, 4), +key.slice(5, 7), 0).getDate(); }

  // v4's weekend rows: a translucent band over Saturday and Sunday — across all the
  // slots of the grid (drawn OVER the cells, as v4's overlay trace was; v4 kept that
  // trace for every metric) and behind the daily-total bars.
  function weekendRows(days, hook) {
    var plugin = {id: 'hmWeekend'};
    plugin[hook] = function (ch) {
      var a = ch.chartArea, rh = a.height / days.length, c = ch.ctx;
      c.save(); c.fillStyle = dark() ? 'rgba(0,0,0,0.15)' : 'rgba(0,0,0,0.10)';
      days.forEach(function (d, i) {
        var dow = new Date(d + 'T12:00:00').getDay();
        if (dow === 0 || dow === 6) c.fillRect(a.left, a.top + i * rh, a.width, rh);
      });
      c.restore();
    };
    return plugin;
  }

  // ── draw one month ─────────────────────────────────────────────────────────
  function drawMonth(key) {
    var p = state.panels[key]; if (!p || !state.months[key]) return;
    p.grid = p.grid || monthGrid(key);
    var days = Object.keys(p.grid).sort().reverse();             // newest at the top
    release(key, true);
    var row = p.el.querySelector('.hm-row');
    if (!days.length) { row.innerHTML = '<div class="hm-empty">No data.</div>'; return; }
    var m = state.metric, sc = state.scale || (state.scale = computeScale()), n = slots();
    var cs = cellSize(p), TOT_W = totW(p), top = p.first ? AXIS_TOP : 0, h = days.length * cs + top + 2;
    var xs = []; for (var i = 0; i < n; i++) xs.push(slotLabel(i));
    var pts = [];
    days.forEach(function (d) { p.grid[d].slots.forEach(function (c, i) { pts.push({x: xs[i], y: d, c: c}); }); });
    // Fixed-size containers and `responsive: true`: Chart.js sizes the canvas to its
    // parent. (With responsive:false it keeps the canvas's default 300x150 and ignores the
    // container — cells came out 5x3 px instead of square.)
    row.innerHTML = '<div class="hm-grid" style="position:relative;height:' + h + 'px;width:' + (n * cs + AXIS_LEFT + 4) +
      'px"><canvas></canvas></div>' + (m === 'intensity' ? '' :
      '<div class="hm-tot" style="position:relative;height:' + h + 'px;width:' + TOT_W + 'px"><canvas></canvas></div>');
    var every = cs >= 18 ? 1 : cs >= 10 ? 2 : 4;           // v4 labelled every slot at 20 px
    var stops = cellStops(sc), fixTop = function (s) { s.height = top; };
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    p.chart = new Chart(row.querySelector('.hm-grid canvas').getContext('2d'), {
      type: 'matrix', plugins: [weekendRows(days, 'afterDatasetsDraw')],
      data: {datasets: [{data: pts, borderWidth: 0,
        backgroundColor: function (ctx) {
          var r = ctx.raw; if (!r) return 'rgba(0,0,0,0)';
          var v = metricOf(r.c, state.metric);
          return isApi(state.metric) ? apiColour(v) : paint(stops, sc.lo, sc.hi, v);
        },
        width: function (ctx) { var a = ctx.chart.chartArea; return a ? a.width / n - 1 : cs - 1; },
        height: function (ctx) { var a = ctx.chart.chartArea; return a ? a.height / days.length - 1 : cs - 1; }}]},
      options: {
        animation: false, maintainAspectRatio: false, responsive: true, devicePixelRatio: dpr,
        // Hover is arithmetic on the grid (attachHover), not Chart.js's tooltip, which
        // repaints the whole chart on every pointer move.
        events: [], plugins: {legend: {display: false}, tooltip: {enabled: false}},
        layout: {padding: {right: 2}},
        scales: {
          x: {type: 'category', labels: xs, position: 'top', offset: true, grid: {display: false},
              display: p.first, afterFit: fixTop,
              ticks: {color: axisC(), autoSkip: false, maxRotation: 45, minRotation: 45, font: {size: 10},
                      callback: function (v, i) { return i % every === 0 ? xs[i] : ''; }}},
          // EXPLICIT, not the default: chartjs-chart-matrix's defaults reverse the y axis,
          // which drew the newest day at the BOTTOM while the hover arithmetic counts rows
          // from the top — naming the wrong day. Checked against scale.getPixelForValue.
          y: {type: 'category', labels: days, offset: true, reverse: false, grid: {display: false},
              afterFit: function (s) { s.width = AXIS_LEFT; },
              ticks: {color: axisC(), autoSkip: false, font: {size: 10}, padding: 2,
                      // every day at v4's size; the 1st and every 5th when cells are small
                      callback: function (v, i) { var dn = +days[i].slice(8);
                        return (cs >= 12 || dn === 1 || dn % 5 === 0) ? String(dn) : ''; }}}
        }
      }
    });
    if (m !== 'intensity') {
      var ts = totStops(sc), tvals = days.map(function (d) { return p.grid[d].total[m]; });
      p.tot = new Chart(row.querySelector('.hm-tot canvas').getContext('2d'), {
        type: 'bar', plugins: [weekendRows(days, 'beforeDatasetsDraw')],
        data: {labels: days, datasets: [{data: tvals, barPercentage: 0.8, categoryPercentage: 1,
          backgroundColor: tvals.map(function (v) { return paint(ts, sc.tlo, sc.thi, v); })}]},
        options: {
          indexAxis: 'y', animation: false, maintainAspectRatio: false, responsive: true, devicePixelRatio: dpr,
          events: [], plugins: {legend: {display: false}, tooltip: {enabled: false}},
          scales: {
            x: {position: 'top', display: p.first, afterFit: fixTop, grid: {display: false},
                ticks: {color: axisC(), maxTicksLimit: TOT_W < 100 ? 2 : 4, font: {size: 10}},
                title: {display: p.first, text: METRICS[m].tot, color: axisC(), font: {size: 11}}},
            y: {type: 'category', labels: days, offset: true, reverse: false, display: false}
          }
        }
      });
    }
    if (p.tot) {
      // Align the totals' rows with the grid's, measured rather than assumed: the grid's
      // day labels make Chart.js pad its chart area (8 px at the bottom, measured) and the
      // totals chart has no labels to do the same.
      var ga = p.chart.chartArea, ta = p.tot.chartArea;
      var pb = Math.max(0, ta.bottom - ga.bottom), pt = Math.max(0, ga.top - ta.top);
      if (pb || pt) { p.tot.options.layout = {padding: {top: pt, bottom: pb}}; p.tot.update('none'); }
    }
    p.days = days; p.xs = xs; p.drawn = true;
    attachHover(p);
  }
  function release(key, keepSize) {
    var p = state.panels[key]; if (!p) return;
    if (p.chart) { p.chart.destroy(); p.chart = null; }
    if (p.tot) { p.tot.destroy(); p.tot = null; }
    p.drawn = false;
    var row = p.el.querySelector('.hm-row');
    if (!keepSize) {                                            // far off screen: free the canvas
      var hgt = row.offsetHeight; row.innerHTML = ''; row.style.height = hgt + 'px';
    } else { row.style.height = ''; }
  }
  function redrawAll(rescale) {
    if (rescale) state.scale = computeScale();
    state.keys.forEach(function (k) { if (state.panels[k] && state.panels[k].drawn) drawMonth(k); });
    var t = state.root && state.root.querySelector('.hm-title');
    if (t) { t.textContent = METRICS[state.metric].title; state.root.querySelector('.hm-sub').textContent = METRICS[state.metric].sub; }
  }

  // ── hover: arithmetic on the grid, an HTML tooltip — the canvas is never repainted ──
  function tipEl() {
    var t = document.getElementById('hm-tip');
    if (!t) { t = document.createElement('div'); t.id = 'hm-tip'; t.className = 'hm-tip'; document.body.appendChild(t); }
    return t;
  }
  function attachHover(p) {
    var row = p.el.querySelector('.hm-row');
    if (row._hmHover) return; row._hmHover = true;
    function show(ev) {
      var tip = tipEl(); if (!p.drawn || !p.chart) { tip.style.display = 'none'; return; }
      var pt = ev.touches ? ev.touches[0] : ev, mm = METRICS[state.metric], v, lab, day;
      var hitTot = !!(p.tot && p.tot.canvas === ev.target);
      var ch = hitTot ? p.tot : p.chart, a = ch.chartArea, r = ch.canvas.getBoundingClientRect();
      var x = pt.clientX - r.left, y = pt.clientY - r.top;
      if (!a || x < a.left || x > a.right || y < a.top || y > a.bottom) { tip.style.display = 'none'; return; }
      day = p.days[Math.floor((y - a.top) / (a.height / p.days.length))];
      if (!day) { tip.style.display = 'none'; return; }
      if (hitTot) { v = p.grid[day].total[state.metric]; lab = mm.tot; }
      else { var ci = Math.floor((x - a.left) / (a.width / p.xs.length));
             v = metricOf(p.grid[day].slots[ci], state.metric); lab = p.xs[ci] + '–' + slotLabel(ci + 1); }
      var txt = (v === null || v === undefined) ? 'no data'
              : isApi(state.metric) ? (hitTot ? v + ' half-hour' + (v === 1 ? '' : 's') + ' without API kWh' : API_TEXT[v])
              : (+v).toFixed(mm.dp) + mm.unit;
      tip.innerHTML = '<b>' + day + '</b> ' + lab + '<br>' + txt;
      tip.style.display = 'block'; tip.style.left = (pt.clientX + 12) + 'px'; tip.style.top = (pt.clientY + 12) + 'px';
    }
    row.addEventListener('mousemove', show);
    row.addEventListener('touchstart', show, {passive: true});
    row.addEventListener('mouseleave', function () { tipEl().style.display = 'none'; });
  }

  // ── data ───────────────────────────────────────────────────────────────────
  function fetchMonth(key) {
    var y = key.slice(0, 4), mo = +key.slice(5, 7);
    return fetchJSON('/api/energy?resolution=block&kind=month&year=' + y + '&month=' + mo).then(function (r) {
      if (r.error) throw new Error(r.error);
      state.tz = state.tz || r.timezone;
      if (state.epoch !== null && r.fingerprint.epoch !== state.epoch) {   // bulk change: drop the cache
        state.months = {}; Object.keys(state.panels).forEach(function (k) { state.panels[k].grid = null; });
      }
      state.epoch = r.fingerprint.epoch;
      state.months[key] = {blocks: r.blocks || [], fp: JSON.stringify(r.fingerprint.days)};
      if (state.panels[key]) state.panels[key].grid = null;
    });
  }
  function loadMonth(key) {
    if (state.loading[key]) return state.loading[key];
    var p = state.panels[key], t0 = performance.now();
    var need = state.months[key] ? Promise.resolve() : fetchMonth(key);
    return (state.loading[key] = need.then(function () {
      var t1 = performance.now();
      p.grid = p.grid || monthGrid(key);
      var before = state.scale ? JSON.stringify(state.scale) : null, after = computeScale();
      state.scale = after;
      if (before && before !== JSON.stringify(after)) redrawAll(false);    // the range widened
      drawMonth(key);
      p.timing = {fetch_ms: Math.round(t1 - t0), draw_ms: Math.round(performance.now() - t1)};
      delete state.loading[key];
    }).catch(function (e) {
      p.el.querySelector('.hm-row').innerHTML = '<div class="hm-empty">Could not load ' + monthLabel(key) + ': ' + e.message + '</div>';
      delete state.loading[key];
    }));
  }

  function buildUI() {
    var root = state.root;
    root.innerHTML = '<div class="hm-bar"><div class="hm-metrics"></div>' +
      '<span class="hm-note">Local time · newest first</span></div>' +
      '<div class="hm-head"><div class="hm-title"></div><div class="hm-sub"></div></div><div class="hm-months"></div>';
    var mb = root.querySelector('.hm-metrics');
    Object.keys(METRICS).forEach(function (k) {
      var b = document.createElement('button'); b.className = 'hm-metric-btn' + (k === state.metric ? ' active' : '');
      b.textContent = METRICS[k].label; b.title = METRICS[k].title;
      b.onclick = function () { state.metric = k;
        mb.querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x === b); });
        redrawAll(true); };
      mb.appendChild(b);
    });
    var wrap = root.querySelector('.hm-months');
    // Draw near the viewport; release far from it (a month's canvases at 2x are ~10 MB).
    var near = new IntersectionObserver(function (ents) {
      ents.forEach(function (e) { var k = e.target.dataset.key;
        if (e.isIntersecting && !state.panels[k].drawn) loadMonth(k); });
    }, {rootMargin: '800px'});
    var far = new IntersectionObserver(function (ents) {
      ents.forEach(function (e) { var k = e.target.dataset.key;
        if (!e.isIntersecting && state.panels[k].drawn) release(k, false); });
    }, {rootMargin: '4000px'});
    state.keys.forEach(function (k, i) {
      var el = document.createElement('section'); el.className = 'hm-month'; el.dataset.key = k;
      var guess = daysIn(k) * 18 + (i === 0 ? AXIS_TOP : 0);
      el.innerHTML = '<div class="hm-mlabel">' + monthLabel(k) + '</div><div class="hm-row" style="height:' + guess + 'px"></div>';
      wrap.appendChild(el); state.panels[k] = {el: el, first: i === 0};
      // Never make the first month wait on an intersection event — a page that is not
      // visible yet (a background tab, a hidden pane) reports none.
      if (i === 0) loadMonth(k);
      near.observe(el); far.observe(el);
    });
    redrawAll(false);
    // Theme: watch the attribute itself, so any toggle from any code path re-draws.
    new MutationObserver(function () { redrawAll(true); })
      .observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
    // Width: square cells are sized from it.
    var lastW = root.clientWidth, rt = null;
    new ResizeObserver(function () {
      if (Math.abs(root.clientWidth - lastW) < 8) return; lastW = root.clientWidth;
      clearTimeout(rt); rt = setTimeout(function () { redrawAll(false); }, 150);
    }).observe(root);
  }

  function init(root) {
    state.root = root || document.getElementById('chart-heatmap-content');
    if (state.inited) return refresh();
    state.inited = true;
    state.root.innerHTML = '<div class="hm-empty">Loading…</div>';
    // The API-coverage view is for supplier-API accounts only; ask once, and a failed
    // answer means "not shown", never an error for the heatmap.
    var apiCheck = fetchJSON('/api/billing-source').then(function (r) {
      if (!(r && r.uses_api)) return;
      var chans = r.api_channels || ['import'];
      Object.keys(API_METRICS).forEach(function (k) {
        if (chans.indexOf(API_METRICS[k].channel) >= 0) METRICS[k] = API_METRICS[k];
      });
    }, function () {});
    return libs().then(function () { return apiCheck; })
      .then(function () { return fetchJSON('/api/periods?kind=month'); }).then(function (p) {
      var b = p.bounds || {};
      if (!b.earliest) { state.root.innerHTML = '<div class="hm-empty">No heatmap data yet.</div>'; return; }
      state.tz = p.timezone || state.tz; state.bounds = b; state.keys = [];
      var y = +b.latest.slice(0, 4), mo = +b.latest.slice(5, 7), stop = b.earliest.slice(0, 7);
      for (;;) {
        var k = y + '-' + (mo < 10 ? '0' : '') + mo; state.keys.push(k);
        if (k <= stop) break; mo--; if (mo < 1) { mo = 12; y--; }
      }
      buildUI();
    }).catch(function (e) { state.root.innerHTML = '<div class="hm-empty">Heatmap unavailable: ' + e.message + '</div>'; });
  }

  // re-fetch the current month (where change happens, C §2a); redraw only if it moved
  function refresh() {
    var k = state.keys[0]; if (!k) return Promise.resolve();
    var before = state.months[k] && state.months[k].fp, ep = state.epoch;
    return fetchMonth(k).then(function () {
      if (state.months[k].fp === before && state.epoch === ep) return;
      if (state.epoch !== ep) { redrawAll(true); return; }
      state.panels[k].grid = null; return loadMonth(k);
    });
  }
  function rerender() { redrawAll(true); return Promise.resolve(); }

  // PNG of every drawn month (cells + daily totals side by side), in the light palette
  // for print, then the view is restored
  function snapshot() {
    state.forceLight = true; redrawAll(true);
    var out = state.keys.filter(function (k) { return state.panels[k].drawn; }).map(function (k) {
      var p = state.panels[k], a = p.chart.canvas, b = p.tot ? p.tot.canvas : null;
      var c = document.createElement('canvas'); c.width = a.width + (b ? b.width : 0); c.height = a.height;
      var x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(a, 0, 0); if (b) x.drawImage(b, a.width, 0);
      return {month: monthLabel(k), url: c.toDataURL('image/png')};
    });
    state.forceLight = false; redrawAll(true);
    return out;
  }

  return {init: init, refresh: refresh, loadMonth: loadMonth, rerender: rerender, snapshot: snapshot,
          metricLabel: function () { return METRICS[state.metric].title; },
          _state: state, _monthGrid: monthGrid, _paint: paint, _kwhStops: kwhStops, _release: release};
})();
</script>

            position:sticky; top:0; z-index:9; margin-bottom:8px; box-sizing:border-box;
            background:var(--surface, var(--card, #1a1d27)); border-radius:0 0 8px 8px;
            box-shadow:0 2px 8px rgba(0,0,0,0.4); }
  .hm-metrics { display:flex; gap:6px; }
  .hm-metric-btn { padding:4px 10px; border-radius:6px; border:1px solid var(--border, #2a2d3a);
                   background:transparent; color:inherit; cursor:pointer; font-size:12px; }
  .hm-metric-btn.active { background:var(--accent, #3b82f6); color:#fff; border-color:transparent; }
  .hm-note { font-size:12px; color:var(--muted, #6b7080); }
  @media (max-width: 600px) { .hm-note { display:none; } }   /* keep the floating bar one row */
  .hm-head { text-align:center; margin:4px 0 6px; }
  .hm-title { font-size:15px; font-weight:600; }
  .hm-sub { font-size:12px; color:var(--muted, #6b7080); margin-top:2px; }
  .hm-month { display:flex; align-items:stretch; }
  .hm-mlabel { writing-mode:vertical-rl; transform:rotate(180deg); font-size:11px; color:var(--muted, #6b7080);
               padding:0 4px; text-align:center; white-space:nowrap; }
  .hm-row { display:flex; gap:12px; flex:1; min-width:0; overflow-x:auto; }
  .hm-grid, .hm-tot { flex:none; }         /* never shrink: cells are sized to stay square */
  .hm-empty { padding:40px; text-align:center; color:var(--muted, #6b7080); }

            border-radius:6px; font-size:12px; line-height:1.4; background:var(--surface, #1a1d27);
            color:var(--text, #e8eaf0); border:1px solid var(--border, #2a2d3a);
            box-shadow:0 4px 12px rgba(0,0,0,.25); }
