<!--
  Heatmaps tab, drawn in the browser from /api/energy (workstream C, 30 Sep 2026).

  Replaces the pre-rendered net_heatmap.html iframe (energy_charts.generate_net_heatmap,
  Plotly). Chart.js 4 + chartjs-chart-matrix — the Usage Stats tab already loads
  Chart.js, and this is the test of whether it is enough for the whole Charts page.

  DATA: /api/energy?resolution=block&kind=month&year=Y&month=M, one request per month,
  newest first. No API shape of its own (C §3a: resolution= must not grow).
  CACHE: in memory, per month, keyed by the response's per-day fingerprint and epoch
  (C §2a). Returning to the tab re-fetches only months whose fingerprint moved.
  LAYOUT: one matrix chart per calendar year, rendered when scrolled into view. A single
  1,200-row canvas at phone pixel density would cost hundreds of MB.
  LOCAL TIME: slots are local wall-clock half-hours in the SITE timezone the response
  carries. On the clocks-back day the repeated hour is SUMMED into its slot (kWh and
  gCO2); v4 overwrote it. On the clocks-forward day the missing hour is empty.
-->
<script>
window.EMTHeatmap = (function () {
  var PLUGIN = 'https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.0.1/dist/chartjs-chart-matrix.min.js';
  var CHARTJS = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js';
  var METRICS = {
    kwh:       {label: 'kWh',       title: 'Net grid import (kWh)',            unit: ' kWh',     dp: 3},
    co2:       {label: 'gCO₂',      title: 'Carbon (gCO₂)',                    unit: ' gCO₂',    dp: 1},
    intensity: {label: 'gCO₂/kWh',  title: 'Grid carbon intensity (gCO₂/kWh)', unit: ' gCO₂/kWh', dp: 0}
  };
  var ROW_PX = 6, TOTAL = 'Σ';
  var state = {metric: 'kwh', tz: null, bm: 30, months: {}, years: [], charts: {}, epoch: null,
               root: null, inited: false, loading: {}, scale: {}};
  var fetchJSON = function (url) { return fetch(apiUrl(url)).then(function (r) { return r.json(); }); };

  function loadScript(src) {
    return new Promise(function (ok, bad) {
      if (document.querySelector('script[src="' + src + '"]')) { ok(); return; }
      var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad;
      document.head.appendChild(s);
    });
  }
  function libs() {
    var p = window.Chart ? Promise.resolve() : loadScript(CHARTJS);
    return p.then(function () {
      return (window.Chart && Chart.registry.controllers.get('matrix')) ? null : loadScript(PLUGIN);
    });
  }
  function dark() {
    if (state.forceLight) return false;                // PDF snapshot prints on white
    return document.documentElement.getAttribute('data-theme') !== 'light';
  }

  // ── local wall-clock parts in the site timezone, memoised per UTC half-hour ──
  var _fmt = null, _memo = {};
  function localParts(utcIso) {
    var hit = _memo[utcIso]; if (hit) return hit;
    if (!_fmt) _fmt = new Intl.DateTimeFormat('en-GB', {timeZone: state.tz, year: 'numeric',
      month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'});
    var p = {}; _fmt.formatToParts(new Date(utcIso + 'Z')).forEach(function (x) { p[x.type] = x.value; });
    var out = {day: p.year + '-' + p.month + '-' + p.day, slot: Math.floor((+p.hour * 60 + +p.minute) / state.bm)};
    _memo[utcIso] = out; return out;
  }
  function slotLabel(i) {
    var m = i * state.bm, h = Math.floor(m / 60), mm = m % 60;
    return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm;
  }

  // ── one year's grid: day -> {slots:[{kwh,co2,int}], total:{kwh,co2}} ──
  function yearGrid(year) {
    var days = {}, slots = Math.round(1440 / state.bm);
    Object.keys(state.months).forEach(function (k) {
      if (k.slice(0, 4) !== String(year)) return;
      (state.months[k].blocks || []).forEach(function (b) {
        if (b.meter_id !== 'electricity_main') return;
        var lp = localParts(b.block_start);
        if (lp.day.slice(0, 4) !== String(year)) return;       // a UTC month edge
        var d = days[lp.day] || (days[lp.day] = {slots: new Array(slots).fill(null), total: {kwh: 0, co2: 0}});
        var net = (b.imp_kwh || 0) - (b.exp_kwh || 0), cg = b.carbon_g;
        var c = d.slots[lp.slot] || (d.slots[lp.slot] = {kwh: 0, co2: null, int: null});
        c.kwh += net;                                         // clocks-back: summed, not overwritten
        if (cg !== null && cg !== undefined) c.co2 = (c.co2 || 0) + cg;
        // The payload states the grid's intensity per block — stored, or carbon_g/net
        // for pre-3.0.0 blocks (BlockStore.get_energy_blocks). A zero-net half-hour
        // still has a grid intensity; only a block with neither is empty.
        if (b.carbon_intensity_g !== null && b.carbon_intensity_g !== undefined) c.int = b.carbon_intensity_g;
        d.total.kwh += net; if (cg) d.total.co2 += cg;
      });
    });
    return days;
  }

  // ── colour: diverging through the background at zero; intensity sequential ──
  function colour(v, max, metric) {
    if (v === null || v === undefined) return 'rgba(0,0,0,0)';
    var bg = dark() ? [26, 29, 39] : [255, 255, 255];
    var t = max > 0 ? Math.max(-1, Math.min(1, v / max)) : 0, hi;
    if (metric === 'intensity') { t = Math.max(0, t); hi = t < 0.5 ? [46, 160, 67] : [220, 60, 50];
      var u = t < 0.5 ? 1 - t * 2 : (t - 0.5) * 2;
      var mid = [245, 190, 60]; var a = t < 0.5 ? hi : mid, z = t < 0.5 ? mid : hi;
      return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(z[i] + (a[i] - z[i]) * u); }).join(',') + ')'; }
    hi = t >= 0 ? [214, 96, 42] : [44, 123, 182];
    var k = Math.abs(t);
    return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(bg[i] + (hi[i] - bg[i]) * k); }).join(',') + ')';
  }
  function metricOf(c, m) { return c ? (m === 'kwh' ? c.kwh : m === 'co2' ? c.co2 : c.int) : null; }

  // shared scale across every year shown, so years are comparable
  function recomputeScale() {
    var m = state.metric, cell = 0, tot = 0;
    state.years.forEach(function (y) {
      var g = state.charts[y] && state.charts[y].grid; if (!g) return;
      Object.keys(g).forEach(function (d) {
        g[d].slots.forEach(function (c) { var v = metricOf(c, m); if (v !== null) cell = Math.max(cell, Math.abs(v)); });
        if (m !== 'intensity') tot = Math.max(tot, Math.abs(g[d].total[m]));
      });
    });
    state.scale = {cell: cell, total: tot};
  }

  function renderYear(year) {
    var holder = state.charts[year];
    var grid = holder.grid = yearGrid(year);
    var days = Object.keys(grid).sort().reverse();
    if (!days.length) { holder.el.innerHTML = '<div class="hm-empty">No data for ' + year + '.</div>'; return; }
    recomputeScale();
    var m = state.metric, slots = Math.round(1440 / state.bm), xs = [];
    for (var i = 0; i < slots; i++) xs.push(slotLabel(i));
    xs.push(TOTAL);
    var pts = [];
    days.forEach(function (d) {
      grid[d].slots.forEach(function (c, i) { pts.push({x: xs[i], y: d, v: metricOf(c, m), c: c}); });
      if (m !== 'intensity') pts.push({x: TOTAL, y: d, v: grid[d].total[m], total: true});
    });
    var canvasWrap = holder.el.querySelector('.hm-canvas');
    canvasWrap.style.height = (days.length * ROW_PX + 48) + 'px';
    var th = dark() ? '#6b7080' : '#555566';
    var cfg = {
      type: 'matrix',
      data: {datasets: [{data: pts, borderWidth: 0,
        backgroundColor: function (ctx) {
          var p = ctx.raw; if (!p) return 'rgba(0,0,0,0)';
          return colour(p.v, p.total ? state.scale.total : state.scale.cell, state.metric);
        },
        width: function (ctx) { var a = ctx.chart.chartArea; return a ? Math.max(1, a.width / xs.length - 1) : 4; },
        height: function (ctx) { var a = ctx.chart.chartArea; return a ? Math.max(1, a.height / days.length - 0.5) : ROW_PX; }
      }]},
      options: {
        animation: false, maintainAspectRatio: false, responsive: true,
        // Capped at 2x: a year is a tall canvas, and at a phone's 3x it costs more than
        // twice the memory for no visible gain at 6-pixel rows.
        devicePixelRatio: Math.min(2, window.devicePixelRatio || 1),
        // Chart.js's own tooltip repaints the whole year per pointer move (measured:
        // 22 ms for 17,934 cells on a Mac, ~5x that on a phone). The grid is regular,
        // so the cell under the pointer is arithmetic — `attachHover` draws an HTML
        // tooltip and the canvas is never repainted on hover.
        events: [],
        plugins: {legend: {display: false}, tooltip: {enabled: false}},
        scales: {
          x: {type: 'category', labels: xs, position: 'top', offset: true, grid: {display: false},
              ticks: {color: th, autoSkip: false, maxRotation: 0,
                      callback: function (v, i) { var l = xs[i]; return l === TOTAL ? 'Σ' : (i % 4 === 0 ? l : ''); }}},
          // EXPLICIT, not the default: chartjs-chart-matrix's defaults reverse the y
          // axis, which drew category 0 (the newest day) at the BOTTOM while the hover
          // arithmetic counts rows from the top — naming the wrong day. Checked against
          // scale.getPixelForValue in the harness, not assumed.
          y: {type: 'category', labels: days, offset: true, reverse: false, grid: {display: false},
              ticks: {color: th, autoSkip: false,
                      callback: function (v, i) { var d = days[i]; return d.slice(8) === '01' ? d.slice(0, 7) : ''; }}}
        }
      }
    };
    if (holder.chart) { holder.chart.destroy(); }
    holder.chart = new Chart(canvasWrap.querySelector('canvas').getContext('2d'), cfg);
    holder.days = days; holder.xs = xs;
    attachHover(holder);
  }

  function tipEl() {
    var t = document.getElementById('hm-tip');
    if (!t) { t = document.createElement('div'); t.id = 'hm-tip'; t.className = 'hm-tip'; document.body.appendChild(t); }
    return t;
  }
  function attachHover(holder) {
    var canvas = holder.chart.canvas;
    if (canvas._hmHover) return;                    // one listener per canvas, across re-renders
    canvas._hmHover = true;
    function show(ev) {
      var ch = holder.chart, a = ch.chartArea, r = canvas.getBoundingClientRect();
      var pt = ev.touches ? ev.touches[0] : ev, x = pt.clientX - r.left, y = pt.clientY - r.top;
      var tip = tipEl();
      if (!a || x < a.left || x > a.right || y < a.top || y > a.bottom) { tip.style.display = 'none'; return; }
      var col = Math.floor((x - a.left) / (a.width / holder.xs.length));
      var row = Math.floor((y - a.top) / (a.height / holder.days.length));
      var day = holder.days[row], lab = holder.xs[col], g = holder.grid[day], mm = METRICS[state.metric], v;
      if (!g) { tip.style.display = 'none'; return; }
      if (lab === TOTAL) v = state.metric === 'intensity' ? null : g.total[state.metric];
      else v = metricOf(g.slots[col], state.metric);
      var t0 = lab === TOTAL ? 'daily total' : lab + '–' + slotLabel((col + 1) % holder.xs.length || 0);
      tip.innerHTML = '<b>' + day + '</b> ' + t0 + '<br>' +
        (v === null || v === undefined ? 'no data' : (+v).toFixed(mm.dp) + mm.unit);
      tip.style.display = 'block';
      tip.style.left = (pt.clientX + 12) + 'px'; tip.style.top = (pt.clientY + 12) + 'px';
    }
    canvas.addEventListener('mousemove', show);
    canvas.addEventListener('touchstart', show, {passive: true});
    canvas.addEventListener('mouseleave', function () { tipEl().style.display = 'none'; });
  }

  function monthsOf(year, bounds) {
    var out = [], lo = bounds.earliest, hi = bounds.latest;
    for (var mo = 12; mo >= 1; mo--) {
      var k = year + '-' + (mo < 10 ? '0' : '') + mo;
      if (k >= lo.slice(0, 7) && k <= hi.slice(0, 7)) out.push(k);
    }
    return out;
  }
  function fetchMonth(key) {
    var y = key.slice(0, 4), mo = +key.slice(5, 7);
    return fetchJSON('/api/energy?resolution=block&kind=month&year=' + y + '&month=' + mo).then(function (r) {
      if (r.error) throw new Error(r.error);
      state.tz = state.tz || r.timezone;
      state.months[key] = {blocks: r.blocks || [], fp: JSON.stringify(r.fingerprint.days), epoch: r.fingerprint.epoch};
      if (state.epoch !== null && r.fingerprint.epoch !== state.epoch) {   // bulk change: drop the cache
        Object.keys(state.months).forEach(function (k) { if (k !== key) delete state.months[k]; });
      }
      state.epoch = r.fingerprint.epoch;
    });
  }
  function loadYear(year) {
    if (state.loading[year]) return state.loading[year];
    var keys = monthsOf(year, state.bounds).filter(function (k) { return !state.months[k]; });
    var t0 = performance.now();
    return (state.loading[year] = Promise.all(keys.map(fetchMonth)).then(function () {
      var t1 = performance.now(); renderYear(year);
      state.charts[year].timing = {fetch_ms: Math.round(t1 - t0), render_ms: Math.round(performance.now() - t1)};
      delete state.loading[year];
    }).catch(function (e) {
      state.charts[year].el.innerHTML = '<div class="hm-empty">Could not load ' + year + ': ' + e.message + '</div>';
      delete state.loading[year];
    }));
  }

  function buildUI() {
    var root = state.root;
    root.innerHTML = '<div class="hm-bar"><div class="hm-metrics"></div>' +
      '<span class="hm-note">Local time · newest first · Σ = daily total</span></div><div class="hm-years"></div>';
    var mb = root.querySelector('.hm-metrics');
    Object.keys(METRICS).forEach(function (k) {
      var b = document.createElement('button'); b.className = 'hm-metric-btn' + (k === state.metric ? ' active' : '');
      b.textContent = METRICS[k].label; b.title = METRICS[k].title;
      b.onclick = function () { state.metric = k;
        mb.querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x === b); });
        state.years.forEach(function (y) { if (state.charts[y].grid) renderYear(y); }); };
      mb.appendChild(b);
    });
    var wrap = root.querySelector('.hm-years');
    var io = new IntersectionObserver(function (ents) {
      ents.forEach(function (e) { if (e.isIntersecting) { io.unobserve(e.target); loadYear(+e.target.dataset.year); } });
    }, {rootMargin: '400px'});
    state.years.forEach(function (y) {
      var el = document.createElement('section'); el.className = 'hm-year'; el.dataset.year = y;
      el.innerHTML = '<h3>' + y + '</h3><div class="hm-canvas" style="position:relative;height:' +
        (366 * ROW_PX) + 'px"><canvas></canvas></div>';
      wrap.appendChild(el); state.charts[y] = {el: el};
      // The newest year loads now; older years when they scroll into view. Never
      // make the first year wait on an intersection event — a page that is not
      // visible yet (a background tab, a hidden pane) reports none.
      if (y === state.years[0]) loadYear(y); else io.observe(el);
    });
  }

  function init(root) {
    state.root = root || document.getElementById('chart-heatmap-content');
    if (state.inited) {                           // returning: refresh only what moved
      return refresh();
    }
    state.inited = true;
    state.root.innerHTML = '<div class="hm-empty">Loading…</div>';
    return libs().then(function () { return fetchJSON('/api/periods?kind=year'); }).then(function (p) {
      state.bounds = p.bounds || {};
      if (!state.bounds.earliest) { state.root.innerHTML = '<div class="hm-empty">No heatmap data yet.</div>'; return; }
      var y0 = +state.bounds.earliest.slice(0, 4), y1 = +state.bounds.latest.slice(0, 4);
      state.tz = p.timezone || state.tz; state.years = [];
      for (var y = y1; y >= y0; y--) state.years.push(y);
      buildUI();
    }).catch(function (e) { state.root.innerHTML = '<div class="hm-empty">Heatmap unavailable: ' + e.message + '</div>'; });
  }

  // re-fetch the current month (where change happens, C §2a); a moved fingerprint or
  // epoch re-renders its year, and an epoch change drops every other month too
  function refresh() {
    var now = state.bounds && state.bounds.latest; if (!now) return Promise.resolve();
    var key = now.slice(0, 7), before = state.months[key] && state.months[key].fp, ep = state.epoch;
    return fetchMonth(key).then(function () {
      var moved = state.months[key].fp !== before || state.epoch !== ep;
      if (!moved) return;
      if (state.epoch !== ep) { state.years.forEach(function (y) { state.charts[y].grid = null; }); }
      return loadYear(+key.slice(0, 4));
    });
  }

  // re-draw every loaded year from the cached grid: a theme change or a new layout
  function rerender() {
    state.years.forEach(function (y) { if (state.charts[y] && state.charts[y].grid) renderYear(y); });
    return Promise.resolve();
  }

  // PNG of every rendered year, drawn in the light palette for print, then restored
  function snapshot() {
    state.forceLight = true; rerender();
    var out = state.years.filter(function (y) { return state.charts[y] && state.charts[y].chart; })
      .map(function (y) { return {year: y, url: state.charts[y].chart.toBase64Image('image/png', 1)}; });
    state.forceLight = false; rerender();
    return out;
  }

  return {init: init, refresh: refresh, loadYear: loadYear, rerender: rerender, snapshot: snapshot,
          metricLabel: function () { return METRICS[state.metric].title; },
          _state: state, _yearGrid: yearGrid, _colour: colour};
})();
</script>
<style>
  .hm-bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:8px 4px; }
  .hm-metrics { display:flex; gap:6px; }
  .hm-metric-btn { padding:4px 10px; border-radius:6px; border:1px solid var(--border, #2a2d3a);
                   background:transparent; color:inherit; cursor:pointer; font-size:12px; }
  .hm-metric-btn.active { background:var(--accent, #3b82f6); color:#fff; border-color:transparent; }
  .hm-note { font-size:12px; color:var(--muted, #6b7080); }
  .hm-year h3 { margin:14px 4px 4px; font-size:14px; }
  .hm-empty { padding:40px; text-align:center; color:var(--muted, #6b7080); }
  .hm-tip { position:fixed; z-index:50; pointer-events:none; display:none; padding:6px 8px;
            border-radius:6px; font-size:12px; line-height:1.4; background:var(--surface, #1a1d27);
            color:var(--text, #e8eaf0); border:1px solid var(--border, #2a2d3a);
            box-shadow:0 4px 12px rgba(0,0,0,.25); }
</style>
